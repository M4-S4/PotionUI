name: Backend + frontend tests

# Runs the real pytest suite (not just the dry-run resolve + architecture
# guard onboarding-smoke.yml already covers) on a CPU-only runner, plus the
# frontend unit tests. GPU-bound and real-model-file tests are excluded via
# the `requires_gpu`/`requires_models` markers (see tests/conftest.py) - this
# runner has no CUDA device and, per the maintainer's hard rule, must never
# read a real model checkpoint even if one happened to be present.
#
# requirements-ci.txt is a trimmed copy of requirements.txt (see its own
# header for what's excluded and why); constraints.txt is NOT used here, as
# it pins a CUDA-specific transitive closure, which has no
# CPU-only equivalent.

on:
  push:
    branches: [master, dev]
  pull_request:

permissions:
  contents: read

concurrency:
  group: backend-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    # The full suite in one job exceeds the timeout on the 4-vCPU runner;
    # tests/platform (the tensor-heavy half) gets its own shard.
    name: backend pytest (CPU-only, ${{ matrix.shard.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard:
          # serial_paths: fail under xdist on this runner only — see
          # docs/testing-notes.md "xdist-only CI failures".
          - name: platform
            paths: >-
              tests/platform
              tests/features/plugins
              --ignore=tests/platform/runtime/native/test_engine.py
              --ignore=tests/platform/runtime/native/arch/test_minimax_music3_ar_loop.py
            serial_paths: ""
          - name: features
            paths: >-
              tests/features/generation
              tests/features/remote_execution
              tests/features/auth
              tests/features/media_index
              tests/features/backends
              tests/features/models
              tests/pipelines
            serial_paths: >-
              tests/platform/runtime/native/test_engine.py
              tests/platform/runtime/native/arch/test_minimax_music3_ar_loop.py
          - name: rest
            paths: >-
              tests/
              --ignore=tests/platform
              --ignore=tests/pipelines
              --ignore=tests/features/plugins
              --ignore=tests/features/generation
              --ignore=tests/features/remote_execution
              --ignore=tests/features/auth
              --ignore=tests/features/media_index
              --ignore=tests/features/backends
              --ignore=tests/features/models
            serial_paths: ""
    steps:
      - uses: actions/checkout@v4

      - id: py
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Resolve cache week
        id: week
        run: echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"

      - name: Restore apt archives
        id: apt
        uses: actions/cache/restore@v4
        with:
          path: ~/apt-archives
          key: apt-${{ runner.os }}-libglib-ffmpeg-${{ steps.week.outputs.week }}

      # libglib2.0-0 supplies libgthread-2.0.so.0, which `import cv2` needs
      # (see docs/testing-notes.md) - without it the cv2-dependent suites
      # skip silently rather than fail, so install it for real coverage.
      # ffmpeg unlocks the media-editing suite's video/audio round-trips the
      # same way.
      - name: Install system dependencies
        timeout-minutes: 16
        run: |
          sudo grep -rl "dl.google.com" /etc/apt/sources.list.d/ 2>/dev/null | xargs -r sudo rm -f
          mkdir -p ~/apt-archives/partial
          APT_OPTS="-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o Dir::Cache::Archives=$HOME/apt-archives"
          for attempt in 1 2 3; do
            if [ "$attempt" -gt 1 ]; then
              sudo sed -i 's#http://azure.archive.ubuntu.com/ubuntu#http://archive.ubuntu.com/ubuntu#g' /etc/apt/apt-mirrors.txt /etc/apt/sources.list /etc/apt/sources.list.d/*.sources 2>/dev/null || true
              sudo dpkg --configure -a || true
            fi
            sudo timeout -k 10 90 apt-get update $APT_OPTS || true
            sudo timeout -k 10 180 apt-get install -y --no-install-recommends $APT_OPTS libglib2.0-0 ffmpeg && break
            [ "$attempt" = 3 ] && exit 1
            sleep 10
          done
          sudo rm -rf ~/apt-archives/partial ~/apt-archives/lock
          sudo chown -R "$(id -u):$(id -g)" ~/apt-archives

      - name: Save apt archives
        if: steps.apt.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/apt-archives
          key: apt-${{ runner.os }}-libglib-ffmpeg-${{ steps.week.outputs.week }}

      - name: Restore Python environment
        id: venv
        uses: actions/cache@v4
        with:
          path: ~/venv-ci
          key: py-venv-${{ runner.os }}-${{ steps.py.outputs.python-version }}-${{ hashFiles('requirements-ci.txt', 'requirements-dev.txt') }}-${{ steps.week.outputs.week }}

      # pytest-timeout backs pytest.ini's `timeout = 300` - it is not in
      # requirements-dev.txt today, so it's installed explicitly here rather
      # than assumed present.
      - name: Install backend dependencies (CPU-only torch)
        if: steps.venv.outputs.cache-hit != 'true'
        run: |
          python -m venv ~/venv-ci
          ~/venv-ci/bin/python -m pip install --upgrade pip
          ~/venv-ci/bin/python -m pip install -r requirements-ci.txt --extra-index-url https://download.pytorch.org/whl/cpu
          ~/venv-ci/bin/python -m pip install -r requirements-dev.txt
          ~/venv-ci/bin/python -m pip install pytest-timeout

      - name: Use the Python environment
        run: echo "$HOME/venv-ci/bin" >> "$GITHUB_PATH"

      # One BLAS thread per worker: without the pins, 4 workers x 4 OMP
      # threads oversubscribe the 4 cores and float reductions go
      # nondeterministic mid-test.
      - name: pytest (CPU-only, no GPU/model-file/gc-sensitive tests)
        env:
          OMP_NUM_THREADS: "1"
          MKL_NUM_THREADS: "1"
          OPENBLAS_NUM_THREADS: "1"
          POTIONUI_TEST_THREADS: "1"
          POTIONUI_TEST_BUDGET_S: "15"
        run: >
          python -m pytest ${{ matrix.shard.paths }} -q --durations=25 --timeout=300 -n 4 --dist worksteal
          -m "not requires_gpu and not requires_models and not gc_sensitive"
          --junitxml=junit-linux-${{ matrix.shard.name }}.xml

      # timeout-method=thread: the default signal method can't interrupt a
      # hang inside native code.
      #
      # No BLAS pins and a 300s per-test budget here: this step is sequential
      # (one process, no oversubscription), and part of the hosted fleet lacks
      # native bf16 (AMX/AVX512-BF16) — torch's bf16 conv2d fallback there is
      # 10-20x slower, so a 60s cap on 1 thread is runner roulette. True hangs
      # are still killed by the 8-minute step cap.
      - name: pytest (sequential quarantine — xdist-only failures on this runner)
        if: matrix.shard.serial_paths != ''
        timeout-minutes: 8
        env:
          POTIONUI_TEST_BUDGET_S: "15"
        run: >
          python -m pytest ${{ matrix.shard.serial_paths }} -q --durations=25
          --timeout=300 --timeout-method=thread
          -m "not requires_gpu and not requires_models and not gc_sensitive"
          --junitxml=junit-linux-${{ matrix.shard.name }}-serial.xml

      - name: pytest (marketplace plugin test suites)
        if: matrix.shard.name == 'rest'
        env:
          OMP_NUM_THREADS: "1"
          MKL_NUM_THREADS: "1"
          OPENBLAS_NUM_THREADS: "1"
          POTIONUI_TEST_THREADS: "1"
          POTIONUI_PLUGIN_SUITE_WORKERS: "10"
        run: >
          python tests/plugins/run_suites.py -q --timeout=300
          -m "not requires_gpu and not requires_models and not gc_sensitive"

      - name: Fresh-install guided setup journey (fake Hugging Face)
        if: matrix.shard.name == 'rest'
        env:
          OMP_NUM_THREADS: "1"
          MKL_NUM_THREADS: "1"
          OPENBLAS_NUM_THREADS: "1"
        run: python tests/e2e/journeys/run.py fresh_install_guided_setup

      - name: Upload pytest results (Linux)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-tests-linux-${{ matrix.shard.name }}
          path: |
            junit-linux-${{ matrix.shard.name }}.xml
            junit-linux-${{ matrix.shard.name }}-serial.xml
          retention-days: 14

  frontend-tests:
    name: frontend unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: npm ci
        working-directory: frontend
        run: npm ci

      # onboarding-smoke.yml's frontend-build job already covers
      # `svelte-kit sync` + a production build; this job adds the vitest
      # suite that job doesn't run. `npm run check` is deliberately not
      # added here to avoid duplicating that coverage.
      - name: npm run test:unit
        working-directory: frontend
        run: npm run test:unit

      - name: npm run test:component
        working-directory: frontend
        run: npm run test:component
