schema_version: 1
id: "moss-image-starter"
version: 1
name: "MOSS-Image Starter"
engine: "native"
category: "image"
summary: "Get a working MOSS-Image setup on your local GPU and produce a first image."
description: >
  Installs the bundled MOSS-Image preset on the native (in-process) engine,
  makes sure its three model files are available, and proves the pipeline is
  wired up correctly before handing you a ready-to-use preset (see
  docs/models/moss_image.md). The recipe pins the SFT checkpoint in bf16,
  the int8 Qwen3.5-9B text encoder and the shared Flux2 VAE from
  Comfy-Org's MOSS-Image release (Apache-2.0). The three files together are
  a real download (~20 GB); a 24 GB GPU is recommended.

plugins:
  - id: "huggingface-provider"
    reason: >
      Resolves the diffusion model, text encoder and VAE from HuggingFace
      (Comfy-Org's split-file release of MOSS-Image) by exact repo path.
      HuggingFace has no hash-lookup API, so each artifact below names its
      file explicitly; the sha256 in each artifact's checksum still verifies
      the download afterwards.

backend:
  engine: "native"

artifacts:
  - id: "moss-image-diffusion-model"
    kind: "diffusion_model"
    model_type: "diffusion_model"
    filename: "moss_image_sft_bf16.safetensors"
    display_name: "MOSS-Image SFT (DiT, bf16)"
    required: true
    size_bytes: 10164655808
    checksum:
      algorithm: "sha256"
      value: "f96738d8116d78b7316b57c663d8c98591ddafab7488f48e3099b7655e34ab6f"
    capability: "model-lookup"
    provider_hint:
      source: "huggingface"
      model_id: "Comfy-Org/MOSS-Image"
      version_id: "main@diffusion_models/moss_image_sft_bf16.safetensors"

  - id: "moss-image-text-encoder"
    kind: "text_encoder"
    model_type: "text_encoder"
    filename: "qwen3.5_9b_int8_convrot.safetensors"
    display_name: "Qwen3.5-9B text encoder (int8)"
    required: true
    size_bytes: 9748121532
    checksum:
      algorithm: "sha256"
      value: "32e3787472f708fa5f83624acbf5ef23f7fc89c439e05065ea57cfe5a97f025a"
    capability: "model-lookup"
    provider_hint:
      source: "huggingface"
      model_id: "Comfy-Org/MOSS-Image"
      version_id: "main@text_encoders/qwen3.5_9b_int8_convrot.safetensors"

  - id: "moss-image-vae"
    kind: "vae"
    model_type: "vae"
    filename: "flux2-vae.safetensors"
    display_name: "Flux2 VAE"
    required: true
    size_bytes: 336211292
    checksum:
      algorithm: "sha256"
      value: "868fe7b343cc8f3a19dbcfcafbc3d5f888802be3f89bd81b65b3621a066ce8f3"
    capability: "model-lookup"
    provider_hint:
      source: "huggingface"
      model_id: "Comfy-Org/MOSS-Image"
      version_id: "main@vae/flux2-vae.safetensors"

presets:
  - preset_id: "01M52YQH5XRAH60J82RY5NTM2V"
    path_hint: "marketplace/MOSS-Image"
    assign_to_owner: true

smoke:
  preset_id: "01M52YQH5XRAH60J82RY5NTM2V"
  mode: "txt2img"
  prompt: "a small red boat on a calm lake at sunset, photograph"
  seed: 12345
  form:
    speed_profile: "custom"
    steps: 12
    cfg: 3.0
    sampler: "euler"
    resolution: "1024x1024"

steps:
  - key: "plugins.ensure"
    kind: "plugins.ensure"
    title: "Enable required plugins"
    params:
      plugin_ids: ["huggingface-provider"]

  - key: "backend.ensure"
    kind: "backend.ensure"
    title: "Prepare the native backend"
    params:
      engine: "native"

  - key: "models.index"
    kind: "models.index"
    title: "Find models you already have"
    params:
      engine: "native"

  - key: "artifacts.plan"
    kind: "artifacts.plan"
    title: "Plan required downloads"
    params:
      artifact_ids: ["moss-image-diffusion-model", "moss-image-text-encoder", "moss-image-vae"]

  - key: "artifacts.fetch"
    kind: "artifacts.fetch"
    title: "Download the MOSS-Image model files"
    params:
      artifact_ids: ["moss-image-diffusion-model", "moss-image-text-encoder", "moss-image-vae"]

  - key: "models.index.downloads"
    kind: "models.index"
    title: "Register downloaded models"
    params:
      engine: "native"

  - key: "preset.ensure"
    kind: "preset.ensure"
    title: "Install and assign the MOSS-Image preset"
    params:
      preset_id: "01M52YQH5XRAH60J82RY5NTM2V"

  - key: "pipeline.render"
    kind: "pipeline.render"
    title: "Validate the pipeline"
    params:
      preset_id: "01M52YQH5XRAH60J82RY5NTM2V"
      mode: "txt2img"

  - key: "generation.smoke"
    kind: "generation.smoke"
    title: "Run a first real generation"
    params:
      preset_id: "01M52YQH5XRAH60J82RY5NTM2V"
      mode: "txt2img"

  - key: "workspace.activate"
    kind: "workspace.activate"
    title: "Finish onboarding"
    onboarding_only: true
    params: {}
