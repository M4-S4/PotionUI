fields:
  - name: "steps"
    type: "slider"
    label: "Steps"
    audience: "advanced"
    default: "{{ vars.steps }}"
    configuration: {min: 1, max: 100, step: 1}
    reactions:
      - when: { field: "speed_profile", equals: "turbo" }
        then: { set_value: "{{ vars.steps_turbo }}", set_disabled: false }
      - when: { field: "speed_profile", equals: "base" }
        then: { set_value: "{{ vars.steps_base }}", set_disabled: false }
      - when: { field: "speed_profile", equals: "custom" }
        then: { set_disabled: false }

  - type: "row"
    children:
      - name: "sampler"
        type: "sampler"
        label: "Sampler"
        audience: "advanced"
        default: "euler"
        configuration:
          family: "{{ vars.family }}"
          exclude: ["lcm"]
        reactions:
          - when: { field: "speed_profile", equals: "turbo" }
            then: { set_value: "euler", set_disabled: false }
          - when: { field: "speed_profile", equals: "base" }
            then: { set_value: "euler", set_disabled: false }
          - when: { field: "speed_profile", equals: "custom" }
            then: { set_disabled: false }

      - name: "schedule"
        type: "schedule"
        label: "Schedule"
        audience: "advanced"
        default: "shift"
        configuration:
          family: "{{ vars.family }}"
          exclude: ["manual"]
        reactions:
          - when: { field: "speed_profile", equals: "turbo" }
            then: { set_value: "shift", set_disabled: false }
          - when: { field: "speed_profile", equals: "base" }
            then: { set_value: "shift", set_disabled: false }
          - when: { field: "speed_profile", equals: "custom" }
            then: { set_disabled: false }

  - name: "cfg"
    type: "slider"
    label: "CFG Scale"
    audience: "advanced"
    default: "{{ vars.cfg }}"
    configuration: {min: 1.0, max: 10.0, step: 0.5}
    reactions:
      - when: { field: "speed_profile", equals: "turbo" }
        then: { set_value: 1.0, set_disabled: false }
      - when: { field: "speed_profile", equals: "base" }
        then: { set_value: "{{ vars.cfg_base }}", set_disabled: false }
      - when: { field: "speed_profile", equals: "custom" }
        then: { set_disabled: false }

  - name: "shift"
    type: "number"
    label: "Shift (override)"
    audience: "advanced"
    configuration: {min: 0.1, max: "{{ vars.shift_max }}", step: 0.05}
