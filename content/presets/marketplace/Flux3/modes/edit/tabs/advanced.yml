fields:
  - type: "section"
    label: "Sampling"
    formula: "speed"
    children:
      - name: "steps"
        type: "slider"
        label: "Steps (0 = checkpoint default)"
        audience: "advanced"
        default: 0
        configuration: {min: 0, max: 100, step: 1}
        reactions:
          - when: { field: "speed_profile", equals: "auto" }
            then: { set_value: 0, set_disabled: true }
          - when: { field: "speed_profile", equals: "custom" }
            then: { set_disabled: false }

      - type: "row"
        children:
          - name: "sampler"
            type: "sampler"
            label: "Sampler"
            audience: "advanced"
            default: "euler"
            configuration:
              family: "flux3"
              exclude: ["lcm"]
            reactions:
              - when: { field: "speed_profile", equals: "auto" }
                then: { set_value: "euler", set_disabled: false }
              - when: { field: "speed_profile", equals: "custom" }
                then: { set_disabled: false }

          - name: "schedule"
            type: "schedule"
            label: "Schedule"
            audience: "advanced"
            default: "shift"
            configuration:
              family: "flux3"
              exclude: ["manual"]
            reactions:
              - when: { field: "speed_profile", equals: "auto" }
                then: { set_value: "shift", set_disabled: false }
              - when: { field: "speed_profile", equals: "custom" }
                then: { set_disabled: false }

      - name: "cfg"
        type: "slider"
        label: "CFG Scale (0 = checkpoint default)"
        audience: "advanced"
        default: 0
        configuration: {min: 0, max: 10.0, step: 0.5}
        reactions:
          - when: { field: "speed_profile", equals: "auto" }
            then: { set_value: 0, set_disabled: true }
          - when: { field: "speed_profile", equals: "custom" }
            then: { set_disabled: false }

      - name: "shift"
        type: "number"
        label: "Shift (override)"
        audience: "advanced"
        configuration: {min: 0.1, max: 20.0, step: 0.05}

  - type: "section"
    label: "Step Cache"
    formula: "cache"
    children:
      - type: "row"
        children:
          - name: "step_cache_threshold"
            type: "slider"
            label: "Cache threshold"
            default: 0.0
            ai_hint: "A speed-for-fidelity trade, never a quality improvement. Only the Base checkpoint uses it; the distilled one ignores it. Suggest 0.08 when the user wants a faster Base render and can accept some softening of fine detail. Keep it at 0.0 for final renders."
            configuration: {min: 0.0, max: 0.3, step: 0.01}
          - name: "step_cache_warmup_steps"
            type: "slider"
            label: "Warmup steps"
            default: 4
            ai_hint: "Only has an effect when Cache threshold is above 0. Raise toward 6-8 if a cached run loses composition."
            configuration: {min: 0, max: 12, step: 1}
          - name: "step_cache_max_skips"
            type: "slider"
            label: "Max consecutive skips"
            default: 3
            ai_hint: "Only has an effect when Cache threshold is above 0. Lower to 1-2 if a cached run drifts or loses detail late in the trajectory."
            configuration: {min: 0, max: 10, step: 1}
