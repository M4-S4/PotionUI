fields:
  - type: "section"
    label: "Sampling"
    formula: "speed"
    children:
      file: "{{ paths._shared }}/native/sampling_turbo_base.yml"
      vars: {family: "flux3", steps: 50, steps_turbo: 16, steps_base: 50, cfg: 3.5, cfg_base: 3.5, shift_max: 20.0}

  - type: "section"
    label: "Step Cache"
    formula: "cache"
    children:
      - type: "row"
        children:
          - name: "step_cache_threshold"
            type: "slider"
            label: "Cache threshold"
            default: 0.0
            ai_hint: "A speed-for-fidelity trade, never a quality improvement. Only the Base checkpoint uses it; the distilled one ignores it. Suggest 0.08 when the user wants a faster Base render and can accept some softening of fine detail. Keep it at 0.0 for final renders."
            configuration: {min: 0.0, max: 0.3, step: 0.01}
          - name: "step_cache_warmup_steps"
            type: "slider"
            label: "Warmup steps"
            default: 4
            ai_hint: "Only has an effect when Cache threshold is above 0. Raise toward 6-8 if a cached run loses composition."
            configuration: {min: 0, max: 12, step: 1}
          - name: "step_cache_max_skips"
            type: "slider"
            label: "Max consecutive skips"
            default: 3
            ai_hint: "Only has an effect when Cache threshold is above 0. Lower to 1-2 if a cached run drifts or loses detail late in the trajectory."
            configuration: {min: 0, max: 10, step: 1}
