fields:
  - name: "speed_profile"
    type: "select"
    formula: "speed"
    label: "Speed profile"
    default: "base"
    configuration:
      options:
        - { label: "Turbo", value: "turbo", sub_label: "16 steps, no CFG, distilled checkpoint" }
        - { label: "Base", value: "base", sub_label: "50 steps, CFG 3.5, Base checkpoint" }
        - { label: "Custom", value: "custom", sub_label: "set steps/CFG freely" }

  - type: "section"
    label: "Image"
    children:
      - type: "row"
        children:
          - name: "seed"
            type: "seed"
            label: "Seed"
            default: -1
            width: "3/5"

          - name: "quantity"
            type: "stepper"
            label: "Quantity"
            default: 1
            width: "2/5"
            full_width: true
            configuration: {min: 1, max: 10, step: 1}

      - name: "resolution"
        type: "resolution"
        formula: "size"
        label: "Resolution"
        configuration:
          files:
            - { path: "{{ paths._shared }}/resolutions/flux3.yml", group: "FLUX 3" }
            - { path: "{{ paths._shared }}/resolutions/social_media.yml", group: "Social Media" }
            - { path: "{{ paths._shared }}/resolutions/2k.yml", group: "2K" }
        default: "1024x1024"

  - type: "section"
    label: "Models"
    formula: "models"
    children:
      - name: "diffusion_model"
        type: "model"
        label: "Diffusion Model"
        required: true
        configuration:
          model_type: "diffusion_model"
          placeholder: "Select a FLUX 3 Image Klein checkpoint (distilled or base)..."
          filter_tags: "@config:checkpoint_tags"

      - name: "text_encoder"
        type: "model"
        label: "Text Encoder (Qwen3-VL-4B)"
        required: true
        configuration:
          model_type: "text_encoder"
          placeholder: "Select Qwen3-VL-4B text encoder..."
          filter_tags: "@config:text_encoder_tags"
          recommendations:
            - name: "qwen3vl_4b_fp8_scaled.safetensors"
              link: "https://huggingface.co/Comfy-Org/Krea-2/resolve/main/text_encoders/qwen3vl_4b_fp8_scaled.safetensors"
              size: "4.88 GB"
              sha256: "54bd5144df0bbc25dd6ccadfcb826b521445a1b06ae5a42570bdd2974ca87094"
              description: "Qwen3-VL-4B encoder, fp8-scaled - the practical default."
            - name: "qwen3vl_4b_bf16.safetensors"
              link: "https://huggingface.co/Comfy-Org/Krea-2/resolve/main/text_encoders/qwen3vl_4b_bf16.safetensors"
              size: "8.27 GB"
              sha256: "36f3ff447ef59201722e8f9ce6020c9819fdcfba6aa2608c4e09b1c0ce114e34"
              description: "Qwen3-VL-4B encoder, bf16 reference."

      - name: "vae"
        type: "model"
        label: "VAE (FLUX 3 ae)"
        required: true
        configuration:
          model_type: "vae"
          placeholder: "Select the FLUX 3 ae.safetensors VAE..."
          filter_tags: "@config:vae_tags"
