fields:
  - name: "loras"
    type: "lora_picker"
    formula: "loras"
    default: []
    label: "LoRAs"
    ai_hint: "LoRAs add specialized styles, concepts, or characters to MOSS-Image. Multiple LoRAs can be combined. 0.5-0.8 is recommended for most LoRAs, 1.0 = full effect. LoRAs trained for MOSS-Image in the OpenMOSS, diffusers/PEFT, ai-toolkit or ComfyUI layouts all work on both the SFT and Base checkpoints; the run log reports any LoRA keys that did not match."
    configuration:
      model_type: "lora"
      placeholder: "Select a MOSS-Image LoRA..."
      allow_info_modal: true
      strength_min: -10.0
      strength_max: 10.0
      strength_step: 0.1
      strength_default: 1.0
      max_items: 10
      filter_tags: "@config:lora_tags"
