pipeline:
  #############
  ## Media Loader - Load the source image from the form file path
  #############
  - name: "media_loader"
    id: "media_loader"
    enabled: true
    configuration:
      validate_files: true
      max_file_size: 52428800  # 50MB
      auto_detect_type: true
      media:
        - type: "image"
          path: "{{ form.input_image }}"

  #############
  ## Parameter Emitter - record the run's settings on the generation
  #############
  - name: "param_emitter"
    id: "param_emitter"
    enabled: true
    configuration:
      quantity: 1
      parameters:
        - ["canvas", "{{ form.canvas_resolution }}"]
        - ["scale_percent", "{{ form.scale_percent }}"]
        - ["anchor", "{{ form.anchor }}"]
        - ["fill", "{{ form.fill }}"]

  #############
  ## Canvas fit - scale and place onto a fixed canvas
  #############
  - name: "media_tool"
    id: "canvas_fit"
    enabled: true
    input:
      - ["image", "media_loader", "image"]
    configuration:
      display_title: "Fitting canvas"
      tool: "fit_canvas"
      params:
        width: "{{ (form.canvas_resolution).split('x')[0] | int }}"
        height: "{{ (form.canvas_resolution).split('x')[1] | int }}"
        scale_percent: "{{ form.scale_percent }}"
        anchor: "{{ form.anchor }}"
        fill: "{{ form.fill }}"

  #############
  ## Gallery - save the placed image
  #############
  - name: "gallery"
    id: "gallery"
    enabled: true
    input:
      - ["image", "canvas_fit", "image"]
