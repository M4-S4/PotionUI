fields:
  - name: "speed_profile"
    type: "select"
    formula: "speed"
    label: "Speed profile"
    default: "balanced"
    configuration:
      options:
        - { label: "Balanced", value: "balanced", sub_label: "40 steps" }
        - { label: "Turbo", value: "turbo", sub_label: "20 steps" }
        - { label: "Custom", value: "custom", sub_label: "set steps/CFG freely" }

  - type: "section"
    label: "Text"
    children:
      - name: "current_text"
        type: "string"
        label: "Current text"
        ai_hint: "The text now in the image, written exactly as it appears. Leave empty to add new text instead of changing existing text."
      - name: "new_text"
        type: "string"
        label: "New text"
        required: true
        ai_hint: "The text the image should show, written exactly: spelling, case, punctuation and script are kept as typed, in any language."
      - name: "text_hint"
        type: "string"
        label: "Style or placement"
        ai_hint: "Optional. Where the text goes or how it looks, for example 'in white capitals at the top'. It is added to the instruction as 'Placement and style: <your words>.'"

  - type: "section"
    label: "Image"
    children:
      - type: "row"
        children: "{{ paths._shared }}/native/seed_quantity.yml"

  - type: "section"
    label: "Models"
    formula: "models"
    children:
      - name: "diffusion_model"
        type: "model"
        label: "Diffusion Model"
        required: true
        configuration:
          model_type: "diffusion_model"
          placeholder: "Select Qwen-Image-2.1 MMDiT (e.g. qwen_image_2.1_bf16)..."
          filter_tags: "@config:checkpoint_tags"
          recommendations:
            - name: "qwen_image_2.1_bf16.safetensors"
              link: "https://huggingface.co/Comfy-Org/Qwen-Image-2.1/resolve/main/diffusion_models/qwen_image_2.1_bf16.safetensors"
              size: "14.23 GB"
              sha256: "89f4158d066cc33906a199fca85634f766892dd78f49b6698dabf187ac86c4bc"
              description: "Qwen-Image-2.1 MMDiT, bf16 - the validated local checkpoint. Same checkpoint as txt2img -- edit is the same weights, run with the vision tower loaded."

      - name: "text_encoder"
        type: "model"
        label: "Text Encoder (Qwen3-VL-8B)"
        required: true
        configuration:
          model_type: "text_encoder"
          placeholder: "Select Qwen3-VL-8B text encoder..."
          filter_tags: "@config:text_encoder_tags"
          recommendations:
            - name: "qwen3vl_8b_bf16.safetensors"
              link: "https://huggingface.co/Comfy-Org/Qwen-Image-2.1/resolve/main/text_encoders/qwen3vl_8b_bf16.safetensors"
              size: "17.53 GB"
              sha256: "68bdc82bc1b66851162ae656225e7e2068166b603db19bd5d5a3b90eb12669a9"
              description: "Qwen3-VL-8B encoder, bf16 - pairs with the bf16 MMDiT."

      - name: "vae"
        type: "model"
        label: "VAE"
        required: true
        configuration:
          model_type: "vae"
          placeholder: "Select Qwen-Image-2.1 VAE..."
          filter_tags: "@config:vae_tags"
          recommendations:
            - name: "qwen_image_2.1_vae_bf16.safetensors"
              link: "https://huggingface.co/Comfy-Org/Qwen-Image-2.1/resolve/main/vae/qwen_image_2.1_vae_bf16.safetensors"
              size: "0.68 GB"
              sha256: "bb21f7473051e1ac368515dd3f2e15cd44d7a11748ee8823e1ddca3e4876b7c9"
              description: "Qwen-Image-2.1 VAE (RGBA, 16x latent). Alpha is dropped on decode in this preset."
