fields:
  - type: "section"
    label: "Image"
    children:
      - name: "source_image"
        type: "image"
        label: "Image"
        required: true
        ai_hint: "The image to restyle. Without Keep subject exact the result follows its size and aspect ratio at about 1 megapixel; with it the result is returned at the original size."

  - type: "section"
    label: "Task"
    children:
      - name: "restyle_task"
        type: "select"
        label: "Task"
        default: "style"
        ai_hint: "What to do with the image. Each task builds the instruction from your description: Style: 'Restyle the whole image as <description>. Keep the composition, subjects and layout unchanged.' Background: 'Replace the background with <description>. Keep the subject, its pose and its lighting unchanged.' Lighting: 'Change the lighting to <description>. Keep the composition, subjects and colours of objects unchanged.' Colourise: 'Colourise this black and white photo with natural, realistic colours.' Restore: 'Restore this old photo: remove scratches, dust and fading, repair damage and sharpen detail, keeping the people and scene exactly as they are.' For Colourise and Restore the description is optional and, when given, is added as 'Details: <description>.'"
        configuration:
          options:
            - { label: "Style", value: "style", sub_label: "Repaint the whole image in another look" }
            - { label: "Background", value: "background", sub_label: "Swap the background, keep the subject" }
            - { label: "Lighting", value: "lighting", sub_label: "Change the light or time of day" }
            - { label: "Colourise", value: "colourise", sub_label: "Add colour to a black and white photo" }
            - { label: "Restore", value: "restore", sub_label: "Repair an old or damaged photo" }

      - name: "restyle_text"
        type: "string"
        label: "Description"
        ai_hint: "Short and concrete: a style (watercolour painting, 1980s film still), a background (a white studio, a beach at sunset), or a light (golden hour, soft overcast). Required for Style, Background and Lighting; optional for Colourise and Restore."
        reactions:
          - when: { field: "restyle_task", in: ["style", "background", "lighting"] }
            then:
              update_validation:
                required: true
                message: "Describe the result."

      - name: "keep_subject"
        type: "checkbox"
        label: "Keep subject exact"
        default: false
        visible: false
        description: "Cut the subject out of the original and paste it back over the result, so its pixels do not change. Needs a matting model."
        ai_hint: "Background task only. Runs BiRefNet matting on the original image and pastes the original subject back over the edited image through the matte with a small feather. The subject's pixels are identical to the input; the result is returned at the original size. Off: a plain edit that may drift the subject slightly."
        reactions:
          - when: { field: "restyle_task", equals: "background" }
            then: { set_visibility: true }
          - when: { field: "restyle_task", not_equals: "background" }
            then: { set_value: false }
