fields:
  - name: "speed_profile"
    type: "select"
    formula: "speed"
    label: "Speed profile"
    default: "balanced"
    configuration:
      options:
        - { label: "Balanced", value: "balanced", sub_label: "40 steps" }
        - { label: "Turbo", value: "turbo", sub_label: "20 steps" }
        - { label: "Custom", value: "custom", sub_label: "set steps/CFG freely" }

  - type: "section"
    label: "Task"
    children:
      - name: "restyle_task"
        type: "select"
        label: "Task"
        default: "style"
        ai_hint: "What to do with the image. Each task builds the instruction from your description: Style: 'Restyle the whole image as <description>. Keep the composition, subjects and layout unchanged.' Background: 'Replace the background with <description>. Keep the subject, its pose and its lighting unchanged.' Lighting: 'Change the lighting to <description>. Keep the composition, subjects and colours of objects unchanged.' Colourise: 'Colourise this black and white photo with natural, realistic colours.' Restore: 'Restore this old photo: remove scratches, dust and fading, repair damage and sharpen detail, keeping the people and scene exactly as they are.' For Colourise and Restore the description is optional and, when given, is added as 'Details: <description>.'"
        configuration:
          options:
            - { label: "Style", value: "style", sub_label: "Repaint the whole image in another look" }
            - { label: "Background", value: "background", sub_label: "Swap the background, keep the subject" }
            - { label: "Lighting", value: "lighting", sub_label: "Change the light or time of day" }
            - { label: "Colourise", value: "colourise", sub_label: "Add colour to a black and white photo" }
            - { label: "Restore", value: "restore", sub_label: "Repair an old or damaged photo" }

      - name: "restyle_text"
        type: "string"
        label: "Description"
        ai_hint: "Short and concrete: a style (watercolour painting, 1980s film still), a background (a white studio, a beach at sunset), or a light (golden hour, soft overcast). Required for Style, Background and Lighting; optional for Colourise and Restore."
        reactions:
          - when: { field: "restyle_task", in: ["style", "background", "lighting"] }
            then:
              update_validation:
                required: true
                message: "Describe the result."

      - name: "keep_subject"
        type: "checkbox"
        label: "Keep subject exact"
        default: false
        visible: false
        description: "Cut the subject out of the original and paste it back over the result, so its pixels do not change. Needs a matting model."
        ai_hint: "Background task only. Runs BiRefNet matting on the original image and pastes the original subject back over the edited image through the matte with a small feather. The subject's pixels are identical to the input; the result is returned at the original size. Off: a plain edit that may drift the subject slightly."
        reactions:
          - when: { field: "restyle_task", equals: "background" }
            then: { set_visibility: true }

  - type: "section"
    label: "Image"
    children:
      - type: "row"
        children: "{{ paths._shared }}/native/seed_quantity.yml"

  - type: "section"
    label: "Models"
    formula: "models"
    children:
      - name: "diffusion_model"
        type: "model"
        label: "Diffusion Model"
        required: true
        configuration:
          model_type: "diffusion_model"
          placeholder: "Select Qwen-Image-2.1 MMDiT (e.g. qwen_image_2.1_bf16)..."
          filter_tags: "@config:checkpoint_tags"
          recommendations:
            - name: "qwen_image_2.1_bf16.safetensors"
              link: "https://huggingface.co/Comfy-Org/Qwen-Image-2.1/resolve/main/diffusion_models/qwen_image_2.1_bf16.safetensors"
              size: "14.23 GB"
              sha256: "89f4158d066cc33906a199fca85634f766892dd78f49b6698dabf187ac86c4bc"
              description: "Qwen-Image-2.1 MMDiT, bf16 - the validated local checkpoint. Same checkpoint as txt2img -- edit is the same weights, run with the vision tower loaded."

      - name: "text_encoder"
        type: "model"
        label: "Text Encoder (Qwen3-VL-8B)"
        required: true
        configuration:
          model_type: "text_encoder"
          placeholder: "Select Qwen3-VL-8B text encoder..."
          filter_tags: "@config:text_encoder_tags"
          recommendations:
            - name: "qwen3vl_8b_bf16.safetensors"
              link: "https://huggingface.co/Comfy-Org/Qwen-Image-2.1/resolve/main/text_encoders/qwen3vl_8b_bf16.safetensors"
              size: "17.53 GB"
              sha256: "68bdc82bc1b66851162ae656225e7e2068166b603db19bd5d5a3b90eb12669a9"
              description: "Qwen3-VL-8B encoder, bf16 - pairs with the bf16 MMDiT."

      - name: "vae"
        type: "model"
        label: "VAE"
        required: true
        configuration:
          model_type: "vae"
          placeholder: "Select Qwen-Image-2.1 VAE..."
          filter_tags: "@config:vae_tags"
          recommendations:
            - name: "qwen_image_2.1_vae_bf16.safetensors"
              link: "https://huggingface.co/Comfy-Org/Qwen-Image-2.1/resolve/main/vae/qwen_image_2.1_vae_bf16.safetensors"
              size: "0.68 GB"
              sha256: "bb21f7473051e1ac368515dd3f2e15cd44d7a11748ee8823e1ddca3e4876b7c9"
              description: "Qwen-Image-2.1 VAE (RGBA, 16x latent). Alpha is dropped on decode in this preset."

  - type: "section"
    label: "Subject matting"
    visible: false
    reactions:
      - when:
          logic: "AND"
          conditions:
            - { field: "restyle_task", equals: "background" }
            - { field: "keep_subject", equals: true }
        then: { set_visibility: true }
    children:
      - name: "matting_model"
        type: "model"
        label: "Matting Model"
        ai_hint: "A BiRefNet checkpoint used to cut the subject out for Keep subject exact."
        configuration:
          model_type: "detection_segm"
          placeholder: "Select a BiRefNet checkpoint..."
          filter_tags: "@config:matting_tags"
          allow_info_modal: true
        reactions:
          - when:
              logic: "AND"
              conditions:
                - { field: "restyle_task", equals: "background" }
                - { field: "keep_subject", equals: true }
            then:
              update_validation:
                required: true
                message: "Pick a matting model, or turn off Keep subject exact."
