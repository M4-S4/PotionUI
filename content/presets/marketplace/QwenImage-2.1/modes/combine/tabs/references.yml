fields:
  - name: "images"
    type: "image"
    label: "Images"
    required: true
    configuration:
      multi: true
      max_items: 10
    ai_hint: "Up to 10 images, jointly conditioned. The FIRST image is the one being edited: it sets the output's size and aspect ratio. The others are references (a subject, an object, a style, a background) that the prompt can use. Type @ in the prompt to refer to an image; it is written as <image1>, <image2> and so on, by the image's position in this list. Each image is resized to about 1 megapixel before encoding."
