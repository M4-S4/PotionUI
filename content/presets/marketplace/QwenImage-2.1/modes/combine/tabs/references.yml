fields:
  - type: "section"
    label: "Base image"
    children:
      - name: "source_image"
        type: "image"
        label: "Base image"
        required: true
        ai_hint: "The image that is edited. It sets the output's size and aspect ratio. In the prompt it is called Image 1."

  - type: "section"
    label: "References"
    children:
      - type: "row"
        children:
          - name: "reference_1"
            type: "image"
            label: "Reference 1"
            width: "3/5"
            ai_hint: "An optional reference image blended into the base image. Filled references are numbered in order after the base image: the first is Image 2, the next Image 3, and so on."
          - name: "reference_1_role"
            type: "string"
            label: "Role"
            width: "2/5"
            ai_hint: "A short plain label for this reference, for example subject, jacket, style, background. It is written into the prompt as 'Image N is the <role>.' so the model knows what to take from it. Leave empty to call it a reference."
      - type: "row"
        visible: false
        reactions:
          - when: { field: "reference_1", is_not_empty: true }
            then: { set_visibility: true }
        children:
          - name: "reference_2"
            type: "image"
            label: "Reference 2"
            width: "3/5"
            ai_hint: "An optional further reference image, numbered after the references above it."
          - name: "reference_2_role"
            type: "string"
            label: "Role"
            width: "2/5"
            ai_hint: "A short plain label for this reference, for example subject, jacket, style, background. It is written into the prompt as 'Image N is the <role>.' so the model knows what to take from it. Leave empty to call it a reference."
