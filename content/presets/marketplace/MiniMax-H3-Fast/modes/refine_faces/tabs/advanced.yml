fields:
  - type: "section"
    label: "Sampling"
    children:
      - name: "steps"
        type: "slider"
        formula: "speed"
        label: "Steps"
        audience: "advanced"
        default: 4
        ai_hint: "Denoising steps per tracked face or hand window. The face refine's recipe runs 4; raise it only if refined faces stay soft."
        configuration: {min: 2, max: 24, step: 1}
        reactions:
          - when: { field: "speed_profile", equals: "distilled" }
            then: { set_value: 8, set_disabled: true }
          - when: { field: "speed_profile", equals: "custom" }
            then: { set_disabled: false }

      - name: "refine_sampler"
        type: "select"
        formula: "enhance"
        label: "Refine sampler"
        default: "euler"
        configuration:
          options:
            - { label: "Euler (reference)", value: "euler" }
            - { label: "Res multistep", value: "res_multistep" }
            - { label: "DPM++ 2M", value: "dpmpp_2m" }
            - { label: "ER-SDE (stochastic)", value: "er_sde" }
            - { label: "SA-Solver", value: "sa_solver" }

  - type: "section"
    label: "Refine"
    children:
      - name: "working_short_side"
        type: "slider"
        formula: "enhance"
        label: "Working size (short side, px)"
        default: 512
        configuration: {min: 256, max: 768, step: 32}

      - name: "color_correction"
        type: "select"
        formula: "enhance"
        label: "Colour match"
        default: "wavelet"
        configuration:
          options:
            - { label: "Wavelet", value: "wavelet" }
            - { label: "AdaIN", value: "adain" }
            - { label: "Off", value: "none" }

  - type: "section"
    label: "Detection"
    children:
      - name: "detection_stride"
        type: "slider"
        formula: "enhance"
        label: "Detect every Nth frame"
        default: 6
        configuration: {min: 1, max: 30, step: 1}

      - name: "detection_confidence"
        type: "slider"
        formula: "enhance"
        label: "Detection confidence"
        default: 0.5
        configuration: {min: 0.1, max: 0.95, step: 0.05}
