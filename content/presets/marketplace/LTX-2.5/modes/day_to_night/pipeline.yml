pipeline:
  - name: "media_loader"
    id: "media_loader"
    enabled: true
    configuration:
      validate_files: true
      max_file_size: 524288000
      auto_detect_type: true
      media:
        - type: "video"
          path: "{{ form.input_video }}"

  - name: "model_loader/ltx"
    enabled: true
    configuration:
      model:
        file_path: "{{ form.model }}"
        name: "{{ form.model }}"
      text_encoder:
        file_path: "{{ form.text_encoder }}"
        name: "{{ form.text_encoder }}"
      vae:
        file_path: "{{ form.video_vae }}"
        name: "{{ form.video_vae }}"

  - name: "prompt_encoder"
    input:
      - ["text_encoder", "model_loader/ltx", "text_encoder"]
    enabled: true
    configuration:
      p_prompt:
        input: "{{ generation.prompts.first.positive }}"
        output: "{{ generation.prompts.first.positive or 'A realistic nighttime scene with photorealistic moonlight and deep natural shadows. Only the lighting changes from day to night; identical composition, subjects and camera motion.' }}"
      n_prompt:
        input: "{{ generation.prompts.first.negative }}"
        output: "{{ generation.prompts.first.negative or 'daylight, sunshine, bright sky, pitch black, underexposed, crushed shadows, low quality, distorted' }}"
      pairs: "{{ generation.prompts.pairs }}"
      quantity: "{{ form.quantity }}"
      guidance_scale: 3.5
      negative_applied: "{{ generation.negative_applied }}"

  - name: "seed_generator"
    enabled: true
    configuration:
      seed: "{{ form.seed }}"
      quantity: "{{ form.quantity }}"

  - name: "dynamic_prompts_renderer"
    id: "dynamic_prompts_renderer"
    enabled: true
    configuration:
      pairs: "{{ generation.prompts.pairs }}"
      quantity: "{{ form.quantity }}"

  - name: "from_iotype"
    id: "from_iotype"
    enabled: true
    input:
      - ["seed", "seed_generator", "seed"]
    configuration:
      from: "seed"

  - name: "param_emitter"
    id: "param_emitter"
    enabled: true
    input:
      - ["seed", "from_iotype", "seed"]
    configuration:
      quantity: "{{ form.quantity }}"
      parameters:
        - ["model", "{{ form.model }}"]
        - ["model", "{{ form.text_encoder }}"]
        - ["model", "{{ form.video_vae }}"]
        - ["model", "{{ form.effect_lora }}"]
        - ["positive_prompt", "{{ generation.prompts.positives }}"]
        - ["negative_prompt", "{{ generation.prompts.negatives }}"]
        - ["cfg", 3.5]
        - ["sampler", "euler_ancestral"]
        - ["strength", "{{ form.effect_strength }}"]

  - name: "generator/video_ltx"
    id: "generator"
    input:
      - ["model", "model_loader/ltx", "model"]
      - ["conditioning", "prompt_encoder", "conditioning"]
      - ["seed", "seed_generator", "seed"]
      - ["video", "media_loader", "video"]
    enabled: true
    configuration:
      quantity: "{{ form.quantity }}"
      decode: true
      audio: false
      match_input: true
      match_input_scale: 1.0
      match_input_max_edge: "{{ 1920 if form.output_size == '1080p' else 1280 }}"
      frames: "{{ preset.vars.edit_max_frames }}"
      fps: 24.0
      steps: 30
      cfg: 3.5
      sampler: "euler_ancestral"
      schedule: "ltx_dynamic"
      quality_mode: true
      quality_cfg: 3.5
      quality_stg: 1.0
      quality_rescale: "{{ preset.vars.quality_rescale }}"
      quality_modality: "{{ preset.vars.quality_modality }}"
      quality_stg_blocks: "29"
      media_placements:
        - { source: "video", index: 0, frame: "first", strength: 1.0, role: "reference" }
      scoped_loras:
        - file_path: "{{ form.effect_lora }}"
          weight: "{{ form.effect_strength }}"

  - name: "gallery"
    input:
      - ["video", "generator", "video"]
      - ["seed", "seed_generator", "seed"]
    enabled: true
