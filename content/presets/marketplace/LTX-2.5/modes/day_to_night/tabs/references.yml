fields:
  - name: "input_video"
    type: "video"
    label: "Input Video"
    required: true
    description: "A daytime clip. Up to about 40 seconds."

  - name: "effect_strength"
    type: "slider"
    label: "Strength"
    default: 1.0
    description: "How strongly the scene changes."
    configuration: {min: 0.5, max: 1.5, step: 0.05}
