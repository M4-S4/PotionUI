name: "custom"
mode_label: "Remove object"
short_description: "Remove people and moving objects from a shot."
negative_prompt:
  applies_when: false
requirements:
  - type: "model"
    filename: "ltx-2.5-22b-ic-lora-clean-plate-1.0.safetensors"
    hint: "Download the Remove object LoRA in this mode."
fields:
  - type: "tabs"
    children:
      - type: "tab"
        label: "Generation"
        configuration:
          icon: "generation"
          icon_display: "icon_only"
        children: "{{ paths.preset }}/modes/remove_object/tabs/generation.yml"
      - type: "tab"
        label: "Models"
        configuration:
          icon: "model"
          icon_display: "icon_only"
        children: "{{ paths.preset }}/modes/restore/tabs/models.yml"
