name: "custom"
mode_label: "Add water"
short_description: "Add water to a scene."
negative_prompt:
  applies_when: false
requirements:
  - type: "model"
    filename: "ltx-2.5-22b-ic-lora-water-simulation-0.9.safetensors"
    hint: "Download the Add water LoRA in this mode."
fields:
  - type: "tabs"
    children:
      - type: "tab"
        label: "Generation"
        configuration:
          icon: "generation"
          icon_display: "icon_only"
        children: "{{ paths.preset }}/modes/add_water/tabs/generation.yml"
      - type: "tab"
        label: "Models"
        configuration:
          icon: "model"
          icon_display: "icon_only"
        children: "{{ paths.preset }}/modes/restore/tabs/models.yml"
