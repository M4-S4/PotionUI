name: "custom"
mode_label: "Upscale"
short_description: "Increase the resolution of a video."
negative_prompt:
  applies_when: false
requirements:
  - type: "model"
    filename: "ltx-2.5-22b-ic-lora-pixel-spatial-upscaler-x2-1.0.safetensors"
    hint: "Download the Generative 2x LoRA in this mode."
    optional: true
  - type: "model"
    filename: "ltx-2.5-22b-ic-lora-refine-details-1.0.safetensors"
    hint: "Download the Refine details LoRA in this mode."
    optional: true
fields:
  - type: "tabs"
    children:
      - type: "tab"
        label: "Generation"
        configuration:
          icon: "generation"
          icon_display: "icon_only"
        children: "{{ paths.preset }}/modes/upscale/tabs/generation.yml"
      - type: "tab"
        label: "Models"
        configuration:
          icon: "model"
          icon_display: "icon_only"
        children: "{{ paths.preset }}/modes/upscale/tabs/models.yml"
      - type: "tab"
        label: "LoRA"
        configuration:
          icon: "lora"
          icon_display: "icon_only"
        children: "{{ paths.preset }}/modes/video/tabs/lora.yml"
      - type: "tab"
        label: "Advanced"
        audience: "advanced"
        configuration:
          icon: "settings"
          icon_display: "icon_only"
        children: "{{ paths._shared }}/tabs/ltx_upscale_advanced.yml"
