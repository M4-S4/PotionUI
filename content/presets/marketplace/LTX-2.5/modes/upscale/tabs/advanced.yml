# Sampling, Sigma schedule and Step cache drive the Generative 2x / Refine
# details path (generator_ic) only, so they hide for Standard. The Refine
# section's sampler, CFG and sigmas drive the Standard path's refine pass only;
# Add Quality Prompt applies to every method.
fields:
  - type: "section"
    label: "Sampling"
    formula: "speed"
    reactions:
      - when: { field: "upscale_method", equals: "latent" }
        then: { set_visibility: false }
      - when: { field: "upscale_method", not_equals: "latent" }
        then: { set_visibility: true }
    children:
      file: "{{ paths.preset }}/files/form/sampling.yml"
      vars: {steps: 8, cfg: 1.0, quality_cfg: 3.0}

  - type: "section"
    label: "Sigma schedule"
    reactions:
      - when: { field: "upscale_method", equals: "latent" }
        then: { set_visibility: false }
      - when: { field: "upscale_method", not_equals: "latent" }
        then: { set_visibility: true }
    children: "{{ paths.preset }}/files/form/manual_sigmas.yml"

  - type: "section"
    label: "Step cache (FBCache)"
    formula: "cache"
    audience: "advanced"
    reactions:
      - when: { field: "upscale_method", equals: "latent" }
        then: { set_visibility: false }
      - when: { field: "upscale_method", not_equals: "latent" }
        then: { set_visibility: true }
    children: "{{ paths.preset }}/files/form/step_cache.yml"

  - type: "section"
    label: "Refine"
    children:
      - type: "row"
        reactions:
          - when: { field: "upscale_method", not_equals: "latent" }
            then: { set_visibility: false }
          - when: { field: "upscale_method", equals: "latent" }
            then: { set_visibility: true }
        children: "{{ paths.preset }}/files/form/refine_sampling.yml"

      - name: "apply_quality_prompt"
        type: "checkbox"
        label: "Add Quality Prompt"
        audience: "advanced"
        ai_hint: "Escape hatch for the automatic quality-prompt suffix on the upscale pass. Leave on (default) unless the user explicitly wants the raw prompt sent to the text encoder untouched."
        default: true

      - name: "refine_sigmas"
        type: "textbox"
        label: "Refine Sigmas"
        audience: "advanced"
        ai_hint: "Expert-only override for the Standard method's refine pass -- prefer suggesting the Refine Strength select (References tab) instead. Only suggest hand-typing this for a deliberate custom schedule no Refine Strength option covers (lower first value = less noise re-injected = more faithful to the upsampled source video; higher = more freedom to fix upsampling artifacts, closer to a fresh generation)."
        configuration:
          placeholder: "Comma-separated sigma values, first value < 1.0, e.g. 0.909375, 0.725, 0.421875, 0.0"
        default: ""
        reactions:
          - when: { field: "upscale_method", not_equals: "latent" }
            then: { set_visibility: false }
          - when: { field: "upscale_method", equals: "latent" }
            then: { set_visibility: true }
