# The file pickers live on the Models tab (see the video mode's identical
# split). Krea-2 layout: a "Video" section holds the source clip plus
# seed/quantity (Krea-2's own Image section pairs seed+quantity the same
# way), and an "Enhancement" section (no Krea-2 counterpart) groups this
# mode's own refine/detailer knobs.
fields:
  - type: "section"
    label: "Video"
    children:
      - name: "input_video"
        type: "video"
        label: "Input Video"
        required: true
        ai_hint: "An existing video to upscale, for example a clip generated in the Video mode. Upscaled in latent space and refined at the new resolution. Any frame count or resolution works; the output can end with up to ~0.3s of a frozen final frame due to grid alignment."

      - type: "row"
        children:
          - name: "seed"
            type: "seed"
            label: "Seed"
            default: -1

          - name: "quantity"
            type: "slider"
            label: "Quantity"
            default: 1
            configuration: {min: 1, max: 4, step: 1}

  - type: "section"
    label: "Enhancement"
    children:
      - name: "upscale_method"
        type: "select"
        formula: "enhance"
        label: "Method"
        default: "latent"
        description: "Generative 2x and Refine details go up to 1080p and need their own LoRA."
        configuration:
          options:
            - { label: "Standard", value: "latent" }
            - { label: "Generative 2x", value: "pixel_spatial" }
            - { label: "Refine details", value: "refine_details" }

      - name: "pixel_spatial_lora"
        type: "model"
        formula: "models"
        label: "Generative 2x LoRA"
        required: true
        description: "Needed for Generative 2x."
        configuration:
          model_type: "lora"
          placeholder: "ltx-2.5-22b-ic-lora-pixel-spatial-upscaler-x2-1.0.safetensors"
          recommendations:
            - name: "ltx-2.5-22b-ic-lora-pixel-spatial-upscaler-x2-1.0.safetensors"
              provider: "huggingface"
              ref: '{"repo": "Lightricks/LTX-2.5-22b-IC-LoRA-Pixel-Spatial-Upscaler", "file": "ltx-2.5-22b-ic-lora-pixel-spatial-upscaler-x2-1.0.safetensors", "revision": "main"}'
              size: "327.3 MB"
              description: "LTX-2.5 Pixel-Spatial-Upscaler IC-LoRA, x2. Gated repo: accept the license on Hugging Face and set a token in Admin - Plugins."
        reactions:
          - when: { field: "upscale_method", not_equals: "pixel_spatial" }
            then: { set_visibility: false }
          - when: { field: "upscale_method", equals: "pixel_spatial" }
            then: { set_visibility: true }

      - name: "refine_details_lora"
        type: "model"
        formula: "models"
        label: "Refine details LoRA"
        required: true
        description: "Needed for Refine details."
        configuration:
          model_type: "lora"
          placeholder: "ltx-2.5-22b-ic-lora-refine-details-1.0.safetensors"
          recommendations:
            - name: "ltx-2.5-22b-ic-lora-refine-details-1.0.safetensors"
              provider: "huggingface"
              ref: '{"repo": "Lightricks/LTX-2.5-22b-IC-LoRA-Refine-Details", "file": "ltx-2.5-22b-ic-lora-refine-details-1.0.safetensors", "revision": "main"}'
              size: "1.31 GB"
              description: "LTX-2.5 Refine-Details IC-LoRA. Gated repo: accept the license on Hugging Face and set a token in Admin - Plugins."
        reactions:
          - when: { field: "upscale_method", not_equals: "refine_details" }
            then: { set_visibility: false }
          - when: { field: "upscale_method", equals: "refine_details" }
            then: { set_visibility: true }

      - name: "refine_strength"
        type: "select"
        formula: "enhance"
        label: "Refine Strength"
        ai_hint: "Friendly control for the standalone upscale mode's refine pass. Strong is Lightricks' first-party recipe and the recommended default; suggest Balanced/Light only if the user wants the refine to preserve more of the upsampled source video as-is. The Advanced tab's Refine Sigmas field is an expert override of this same knob -- prefer this select."
        default: "strong"
        configuration:
          options:
            - { label: "Strong (recommended)", value: "strong" }
            - { label: "Balanced", value: "balanced" }
            - { label: "Light", value: "light" }
        reactions:
          - when: { field: "upscale_method", not_equals: "latent" }
            then: { set_visibility: false }
          - when: { field: "upscale_method", equals: "latent" }
            then: { set_visibility: true }

      - name: "enhance_faces_hands"
        type: "checkbox"
        formula: "detailer"
        label: "Enhance faces and hands"
        default: false

      - name: "enhancement_strength"
        type: "select"
        formula: "detailer"
        label: "Enhancement strength"
        ai_hint: "Only used when Enhance faces and hands is on. Balanced is the safe default; suggest Light when the user worries the enhancement changes a face's identity, Strong only when they explicitly want maximum detail and accept more deviation."
        default: "balanced"
        configuration:
          options:
            - { label: "Light", value: "light" }
            - { label: "Balanced", value: "balanced" }
            - { label: "Strong", value: "strong" }
        reactions:
          - when: { field: "enhance_faces_hands", equals: false }
            then: { set_visibility: false }
          - when: { field: "enhance_faces_hands", equals: true }
            then: { set_visibility: true }

      #############
      # Detection models: same idiom as the video mode's fields of the same name
      # (see that mode's tabs/enhance.yml for the full rationale) -- a plain
      # `model` field over model_type "mediapipe", no bespoke recommendations/
      # download flow.
      #############
      - name: "face_detector_model"
        type: "model"
        formula: "models"
        label: "Face Detection Model"
        configuration:
          model_type: "mediapipe"
        reactions:
          - when: { field: "enhance_faces_hands", equals: false }
            then: { set_visibility: false }
          - when: { field: "enhance_faces_hands", equals: true }
            then: { set_visibility: true }

      - name: "hand_detector_model"
        type: "model"
        formula: "models"
        label: "Hand Detection Model"
        configuration:
          model_type: "mediapipe"
        reactions:
          - when: { field: "enhance_faces_hands", equals: false }
            then: { set_visibility: false }
          - when: { field: "enhance_faces_hands", equals: true }
            then: { set_visibility: true }
