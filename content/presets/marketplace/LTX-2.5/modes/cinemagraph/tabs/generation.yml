fields:
  - name: "speed_profile"
    type: "select"
    formula: "speed"
    label: "Speed profile"
    default: "distilled"
    configuration:
      options:
        - { label: "Distilled", value: "distilled", sub_label: "8 steps · CFG off · distilled sigma recipe" }
        - { label: "Balanced", value: "balanced", sub_label: "24 steps · CFG 4 · needs the dev checkpoint" }
        - { label: "Quality", value: "quality", sub_label: "30 steps · CFG 4 · multimodal guidance · needs the dev checkpoint" }
        - { label: "Custom", value: "custom", sub_label: "your own steps · sampler · CFG, left alone" }

  - type: "section"
    label: "Video"
    children:
      - type: "row"
        children: "{{ paths.preset }}/files/form/seed_quantity.yml"

      - name: "resolution"
        type: "resolution"
        formula: "size"
        label: "Resolution"
        configuration:
          files:
            - { path: "{{ paths._shared }}/resolutions/video.yml", group: "Video" }
            - { path: "{{ paths._shared }}/resolutions/social_media_video.yml", group: "Social Media" }
        default: "768x512"

      - name: "duration"
        type: "slider"
        formula: "size"
        label: "Length (seconds)"
        default: 3
        configuration: {min: 1, max: 8, step: 1}

  - type: "section"
    label: "Models"
    formula: "models"
    children:
      file: "{{ paths.preset }}/files/form/models_effect.yml"
      vars:
        lora_label: "Cinemagraph LoRA"
        lora_file: "ltx-2.5-22b-lora-cinemagraph-0.9.safetensors"
        lora_repo: "Lightricks/LTX-2.5-22b-LoRA-Cinemagraph"
        lora_size: "201.5 MB"
        lora_description: "LTX-2.5 Cinemagraph LoRA. Gated repo: accept the license on Hugging Face and set a token in Admin - Plugins."
