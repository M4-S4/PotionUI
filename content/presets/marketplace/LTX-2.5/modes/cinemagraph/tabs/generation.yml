fields:
  - type: "section"
    label: "Image"
    children:
      - name: "input_image"
        type: "image"
        label: "Image"
        required: true
        description: "The still to bring to life. Describe in the prompt what should move."

      - name: "resolution"
        type: "resolution"
        formula: "size"
        label: "Resolution"
        configuration:
          files:
            - { path: "{{ paths._shared }}/resolutions/video.yml", group: "Video" }
            - { path: "{{ paths._shared }}/resolutions/social_media_video.yml", group: "Social Media" }
        default: "768x512"

      - name: "duration"
        type: "slider"
        formula: "size"
        label: "Length (seconds)"
        default: 3
        configuration: {min: 1, max: 8, step: 1}

      - type: "row"
        children:
          - name: "seed"
            type: "seed"
            label: "Seed"
            default: -1

          - name: "quantity"
            type: "slider"
            label: "Quantity"
            default: 1
            configuration: {min: 1, max: 4, step: 1}

  - type: "section"
    label: "Effect"
    children:
      - name: "effect_lora"
        type: "model"
        formula: "models"
        label: "Cinemagraph LoRA"
        required: true
        description: "Needed for this mode."
        configuration:
          model_type: "lora"
          placeholder: "ltx-2.5-22b-lora-cinemagraph-0.9.safetensors"
          recommendations:
            - name: "ltx-2.5-22b-lora-cinemagraph-0.9.safetensors"
              provider: "huggingface"
              ref: '{"repo": "Lightricks/LTX-2.5-22b-LoRA-Cinemagraph", "file": "ltx-2.5-22b-lora-cinemagraph-0.9.safetensors", "revision": "main"}'
              size: "201.5 MB"
              description: "LTX-2.5 Cinemagraph LoRA. Gated repo: accept the license on Hugging Face and set a token in Admin - Plugins."

      - name: "effect_strength"
        type: "slider"
        label: "Strength"
        default: 1.0
        description: "Raise it slightly if nothing moves."
        configuration: {min: 0.5, max: 1.5, step: 0.05}
