fields:
  - name: "input_image"
    type: "image"
    label: "Image"
    required: true
    description: "The still to bring to life. Describe in the prompt what should move."

  - name: "effect_strength"
    type: "slider"
    label: "Strength"
    default: 1.0
    description: "Raise it slightly if nothing moves."
    configuration: {min: 0.5, max: 1.5, step: 0.05}
