name: "custom"
mode_label: "Cinemagraph"
short_description: "Turn a still image into a seamless looping video."
requirements:
  - type: "model"
    filename: "ltx-2.5-22b-lora-cinemagraph-0.9.safetensors"
    hint: "Download the Cinemagraph LoRA in this mode."
fields:
  - type: "tabs"
    children:
      - type: "tab"
        label: "Generation"
        configuration:
          icon: "generation"
          icon_display: "icon_only"
        children: "{{ paths.preset }}/modes/cinemagraph/tabs/generation.yml"
      - type: "tab"
        label: "Models"
        configuration:
          icon: "model"
          icon_display: "icon_only"
        children: "{{ paths.preset }}/modes/restore/tabs/models.yml"
