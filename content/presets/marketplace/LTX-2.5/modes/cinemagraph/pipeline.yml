pipeline:
  - name: "media_loader"
    id: "media_loader"
    enabled: true
    configuration:
      media:
        - type: "image"
          path: "{{ form.input_image }}"

  - name: "model_loader/ltx"
    enabled: true
    configuration:
      model:
        file_path: "{{ form.model }}"
        name: "{{ form.model }}"
      text_encoder:
        file_path: "{{ form.text_encoder }}"
        name: "{{ form.text_encoder }}"
      vae:
        file_path: "{{ form.video_vae }}"
        name: "{{ form.video_vae }}"

  - name: "prompt_encoder"
    input:
      - ["text_encoder", "model_loader/ltx", "text_encoder"]
    enabled: true
    configuration:
      p_prompt:
        input: "{{ generation.prompts.first.positive }}"
        output: "{{ 'CINEMAGRAPH_MOTION ' ~ (generation.prompts.first.positive or 'subtle natural motion in one part of the scene') ~ '. Tripod locked-off static camera, zero camera movement, everything else stays still, seamless natural loop.' }}"
      n_prompt:
        input: "{{ generation.prompts.first.negative }}"
        output: "{{ generation.prompts.first.negative or 'camera movement, pan, tilt, zoom, parallax, whole image moving, background sliding, flicker on entire image, noisy texture, crawling texture, distorted, blurry, low quality' }}"
      pairs: "{{ generation.prompts.pairs }}"
      quantity: "{{ form.quantity }}"
      guidance_scale: 4.0
      negative_applied: "{{ generation.negative_applied }}"

  - name: "seed_generator"
    enabled: true
    configuration:
      seed: "{{ form.seed }}"
      quantity: "{{ form.quantity }}"

  - name: "dynamic_prompts_renderer"
    id: "dynamic_prompts_renderer"
    enabled: true
    configuration:
      pairs: "{{ generation.prompts.pairs }}"
      quantity: "{{ form.quantity }}"

  - name: "from_iotype"
    id: "from_iotype"
    enabled: true
    input:
      - ["seed", "seed_generator", "seed"]
    configuration:
      from: "seed"

  - name: "param_emitter"
    id: "param_emitter"
    enabled: true
    input:
      - ["seed", "from_iotype", "seed"]
    configuration:
      quantity: "{{ form.quantity }}"
      parameters:
        - ["model", "{{ form.model }}"]
        - ["model", "{{ form.text_encoder }}"]
        - ["model", "{{ form.video_vae }}"]
        - ["model", "{{ form.effect_lora }}"]
        - ["positive_prompt", "{{ generation.prompts.positives }}"]
        - ["negative_prompt", "{{ generation.prompts.negatives }}"]
        - ["cfg", 4.0]
        - ["sampler", "euler_ancestral"]
        - ["strength", "{{ form.effect_strength }}"]
        - ["resolution", "{{ form.resolution }}"]

  - name: "generator/video_ltx"
    id: "generator"
    input:
      - ["model", "model_loader/ltx", "model"]
      - ["conditioning", "prompt_encoder", "conditioning"]
      - ["seed", "seed_generator", "seed"]
      - ["image", "media_loader", "image"]
    enabled: true
    configuration:
      quantity: "{{ form.quantity }}"
      decode: true
      audio: false
      resolution: "{{ form.resolution }}"
      frames: "{{ (form.duration * 24) | round | int }}"
      fps: 24.0
      steps: 30
      cfg: 4.0
      sampler: "euler_ancestral"
      schedule: "ltx_dynamic"
      quality_mode: true
      quality_cfg: 4.0
      quality_stg: 1.0
      quality_rescale: "{{ preset.vars.quality_rescale }}"
      quality_modality: "{{ preset.vars.quality_modality }}"
      quality_stg_blocks: "29"
      media_placements:
        - { source: "image", index: 0, frame: "first", strength: 0.8, role: "keyframe" }
      scoped_loras:
        - file_path: "{{ form.effect_lora }}"
          weight: "{{ form.effect_strength }}"

  - name: "gallery"
    input:
      - ["video", "generator", "video"]
      - ["seed", "seed_generator", "seed"]
    enabled: true
