name: "custom"
mode_label: "Restore"
short_description: "Clean up old, blurry or compressed footage."
negative_prompt:
  applies_when:
    logic: "OR"
    conditions:
      - { field: "cfg", greater_than: 1 }
requirements:
  - type: "model"
    filename: "ltx-2.5-22b-ic-lora-restore-1.0.safetensors"
    hint: "Download the Restore LoRA in this mode."
    optional: true
  - type: "model"
    filename: "ltx-2.5-22b-ic-lora-deblur-0.9.safetensors"
    hint: "Download the Remove blur LoRA in this mode."
    optional: true
  - type: "model"
    filename: "ltx-2.5-22b-ic-lora-decompression-0.9.safetensors"
    hint: "Download the Remove compression LoRA in this mode."
    optional: true
fields:
  - type: "tabs"
    children:
      - type: "tab"
        label: "Generation"
        configuration:
          icon: "generation"
          icon_display: "icon_only"
        children: "{{ paths.preset }}/modes/restore/tabs/generation.yml"
      - type: "tab"
        label: "References"
        configuration:
          icon: "image"
          icon_display: "icon_only"
        children: "{{ paths.preset }}/modes/restore/tabs/references.yml"
      - type: "tab"
        label: "LoRA"
        configuration:
          icon: "lora"
          icon_display: "icon_only"
        children: "{{ paths.preset }}/modes/video/tabs/lora.yml"
      - type: "tab"
        label: "Advanced"
        audience: "advanced"
        configuration:
          icon: "settings"
          icon_display: "icon_only"
        children: "{{ paths.preset }}/modes/restore/tabs/advanced.yml"
