# Krea-2 layout: Sampling section holds the knobs the Generation tab's Speed
# profile bakes (files/form/sampling.yml, shared with every other LTX-2.5 mode).
# NAG lives on the Enhance tab (Krea-2 keeps its NAG gate there too); this tab
# keeps LTX-2.5's own sigma-schedule override, the Upscale stage-2 refine knobs
# and the Step cache section, in that order.
fields:
  - type: "section"
    label: "Sampling"
    formula: "speed"
    children:
      file: "{{ paths.preset }}/files/form/sampling.yml"
      vars: {steps: 24, cfg: 4.0, quality_cfg: 3.0}

  - type: "section"
    label: "Sigma schedule"
    children: "{{ paths.preset }}/files/form/manual_sigmas.yml"

  - type: "section"
    label: "Upscale refine (stage 2)"
    reactions:
      - when: { field: "upscale", equals: "off" }
        then: { set_visibility: false }
      - when: { field: "upscale", not_equals: "off" }
        then: { set_visibility: true }
    children:
      - type: "row"
        children: "{{ paths.preset }}/files/form/refine_sampling.yml"

      - name: "upscale_refine_sigmas"
        type: "textbox"
        label: "Upscale Refine Sigmas"
        audience: "advanced"
        ai_hint: "Expert-only override for the two-stage upscale refine pass -- prefer suggesting the Refine Strength select (Enhance tab) instead. Only suggest hand-typing this for a deliberate custom schedule no Refine Strength option covers (lower first value = less noise re-injected = more faithful to the upsampled latent; higher = more freedom to fix upsampling artifacts, closer to a fresh generation)."
        configuration:
          placeholder: "Comma-separated sigma values, first value < 1.0, e.g. 0.909375, 0.725, 0.421875, 0.0"
        default: ""

  - type: "section"
    label: "Step cache (FBCache)"
    formula: "cache"
    audience: "advanced"
    children: "{{ paths.preset }}/files/form/step_cache.yml"
