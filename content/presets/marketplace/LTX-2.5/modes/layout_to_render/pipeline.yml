pipeline:
  - name: "media_loader"
    id: "media_loader"
    enabled: true
    configuration:
      validate_files: true
      max_file_size: 524288000
      auto_detect_type: true
      media:
        - type: "video"
          path: "{{ form.input_video }}"

  - name: "media_loader"
    id: "media_image"
    enabled: true
    configuration:
      media:
        - type: "image"
          path: "{{ form.style_image }}"

  - name: "model_loader/ltx"
    enabled: true
    configuration:
      model:
        file_path: "{{ form.model }}"
        name: "{{ form.model }}"
      text_encoder:
        file_path: "{{ form.text_encoder }}"
        name: "{{ form.text_encoder }}"
      vae:
        file_path: "{{ form.video_vae }}"
        name: "{{ form.video_vae }}"
      upscale_model:
        file_path: "{{ form.upscale_model }}"
        name: "{{ form.upscale_model }}"

  - name: "prompt_encoder"
    input:
      - ["text_encoder", "model_loader/ltx", "text_encoder"]
    enabled: true
    configuration:
      p_prompt:
        input: "{{ generation.prompts.first.positive }}"
        output: "{{ generation.prompts.first.positive or 'A cinematic, photorealistic finished shot' }}"
      n_prompt:
        input: "{{ generation.prompts.first.negative }}"
        output: "{{ generation.prompts.first.negative }}"
      pairs: "{{ generation.prompts.pairs }}"
      quantity: "{{ form.quantity }}"
      guidance_scale: 1.0
      negative_applied: "{{ generation.negative_applied }}"

  - name: "seed_generator"
    enabled: true
    configuration:
      seed: "{{ form.seed }}"
      quantity: "{{ form.quantity }}"

  - name: "dynamic_prompts_renderer"
    id: "dynamic_prompts_renderer"
    enabled: true
    configuration:
      pairs: "{{ generation.prompts.pairs }}"
      quantity: "{{ form.quantity }}"

  - name: "from_iotype"
    id: "from_iotype"
    enabled: true
    input:
      - ["seed", "seed_generator", "seed"]
    configuration:
      from: "seed"

  - name: "param_emitter"
    id: "param_emitter"
    enabled: true
    input:
      - ["seed", "from_iotype", "seed"]
    configuration:
      quantity: "{{ form.quantity }}"
      parameters:
        - ["model", "{{ form.model }}"]
        - ["model", "{{ form.text_encoder }}"]
        - ["model", "{{ form.video_vae }}"]
        - ["model", "{{ form.effect_lora }}"]
        - ["positive_prompt", "{{ generation.prompts.positives }}"]
        - ["negative_prompt", "{{ generation.prompts.negatives }}"]
        - ["cfg", 1.0]
        - ["sampler", "euler_ancestral"]
        - ["strength", "{{ form.effect_strength }}"]
        - ["model", "{{ form.upscale_model }}"]

  - name: "generator/video_ltx"
    id: "generator_stage1"
    input:
      - ["model", "model_loader/ltx", "model"]
      - ["conditioning", "prompt_encoder", "conditioning"]
      - ["seed", "seed_generator", "seed"]
      - ["video", "media_loader", "video"]
      - ["image", "media_image", "image"]
    enabled: true
    configuration:
      quantity: "{{ form.quantity }}"
      decode: false
      audio: false
      match_video: true
      max_pixels: 522240
      frames: "{{ preset.vars.edit_max_frames }}"
      fps: 24.0
      manual_sigmas: "{{ preset.vars.distilled_sigma_recipe }}"
      cfg: 1.0
      sampler: "euler_ancestral"
      media_placements:
        - { source: "video", index: 0, frame: "first", strength: 1.0, role: "reference" }
        - { source: "image", index: 0, frame: "first", strength: 1.0, role: "keyframe" }
      scoped_loras:
        - file_path: "{{ form.effect_lora }}"
          weight: "{{ form.effect_strength }}"

  - name: "latent_upscaler/ltx"
    id: "latent_upscaler"
    input:
      - ["latent", "generator_stage1", "latent"]
      - ["model", "model_loader/ltx", "model"]
    enabled: true
    configuration: {}

  - name: "generator/video_ltx"
    id: "generator"
    input:
      - ["model", "model_loader/ltx", "model"]
      - ["conditioning", "prompt_encoder", "conditioning"]
      - ["seed", "seed_generator", "seed"]
      - ["initial_latent", "latent_upscaler", "latent"]
      - ["video", "media_loader", "video"]
      - ["image", "media_image", "image"]
      - ["audio", "media_loader", "video"]
    enabled: true
    configuration:
      quantity: "{{ form.quantity }}"
      decode: true
      audio: true
      audio_source: "file"
      match_video: true
      frames: "{{ preset.vars.edit_max_frames }}"
      fps: 24.0
      cfg: 1.0
      sampler: "euler"
      refine_sigmas: "{{ preset.vars.stage2_sigma_recipe }}"
      refine_reference: true
      media_placements:
        - { source: "video", index: 0, frame: "first", strength: 1.0, role: "reference" }
        - { source: "image", index: 0, frame: "first", strength: 1.0, role: "keyframe" }
      scoped_loras:
        - file_path: "{{ form.effect_lora }}"
          weight: "{{ form.effect_strength }}"

  - name: "gallery"
    input:
      - ["video", "generator", "video"]
      - ["seed", "seed_generator", "seed"]
    enabled: true
