fields:
  - name: "model"
    type: "model"
    formula: "models"
    label: "Model"
    required: true
    ai_hint: "A safetensors DiT model or full checkpoint of a supported family. fp8 sources are expanded to bf16 before the LoRAs are added."
    configuration:
      model_type: "diffusion_model"
      model_types: [diffusion_model, unet, checkpoint]
      placeholder: "Select a model..."
      allow_info_modal: true

  - name: "loras"
    type: "lora_picker"
    formula: "loras"
    label: "LoRAs"
    required: true
    default: []
    ai_hint: "At least one LoRA; merged in full precision before quantizing. LoKr works; LoHa, DoRA, convolution and text-encoder LoRAs are refused."
    configuration:
      model_type: "lora"
      placeholder: "Select a LoRA..."
      allow_info_modal: true
      show_triggers: false
      strength_min: -4.0
      strength_max: 4.0
      strength_step: 0.05
      strength_default: 1.0
      max_items: 8

  - name: "output_name"
    type: "string"
    label: "Output File Name"
    default: ""
    ai_hint: "Plain file name without folders. Leave empty to derive it from the inputs, for example flux-dev-fp8 or flux-dev+style. .safetensors is added for you."
    configuration:
      placeholder: "Derived from the inputs when empty"
      pattern: '^[^\\/:*?"<>|]*$'
      pattern_message: "A file name cannot contain / \\ : * ? \" < > |"

  - name: "overwrite"
    type: "checkbox"
    label: "Overwrite Existing File"
    default: false
    ai_hint: "Off by default: a run is refused when the output name already exists. The output can never replace one of its own inputs. The drive must keep 10% (at least 2 GiB) free after the write."
