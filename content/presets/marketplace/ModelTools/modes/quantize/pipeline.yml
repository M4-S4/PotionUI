pipeline:
  - name: "param_emitter"
    id: "param_emitter"
    enabled: true
    configuration:
      quantity: 1
      parameters:
        - ["tool", "quantize"]
        - ["model", "{{ form.model }}"]
        - ["format", "{{ form.quant_format | default('fp8_e4m3') }}"]

  - name: "model_tools"
    id: "model_tools"
    enabled: true
    configuration:
      mode: "quantize"
      model: "{{ form.model }}"
      quant_format: "{{ form.quant_format | default('fp8_e4m3') }}"
      keep_patterns: "{{ form.keep_patterns | default('') }}"
      output_name: "{{ form.output_name | default('') }}"
      overwrite: "{{ form.overwrite | default(false) }}"
      is_admin: "{{ runtime.user.is_admin }}"
