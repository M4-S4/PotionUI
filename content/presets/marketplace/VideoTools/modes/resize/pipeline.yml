pipeline:
  - name: "media_loader"
    id: "media_loader"
    enabled: true
    configuration:
      validate_files: true
      max_file_size: 524288000
      auto_detect_type: true
      media:
        - type: "video"
          path: "{{ form.input_video }}"

  - name: "param_emitter"
    id: "param_emitter"
    enabled: true
    configuration:
      quantity: 1
      parameters:
        - ["size", "{{ form.size }}"]
        - ["quality", "{{ form.quality }}"]

  - name: "video_resize"
    id: "resizer"
    input:
      - ["video", "media_loader", "video"]
    enabled: true
    configuration:
      size: "{{ form.size }}"
      quality: "{{ form.quality }}"

  - name: "gallery"
    id: "gallery"
    input:
      - ["video", "resizer", "video"]
    enabled: true
