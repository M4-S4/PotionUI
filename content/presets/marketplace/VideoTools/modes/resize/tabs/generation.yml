fields:
  - name: "input_video"
    type: "video"
    label: "Input Video"
    required: true
    ai_hint: "Content, length, frame rate and sound are unchanged -- only the picture gets smaller."

  - name: "size"
    type: "resolution"
    formula: "resize"
    label: "Size"
    required: true
    default: "1280x720"
    description: "Sizes follow the video's shape. A custom size is a box the video fits inside, never stretched or enlarged."
    ai_hint: "The output size. Options are derived from the input video: Original, common heights (1080p, 720p, 540p, 480p, 360p) below the source, and 75/50/33/25% scales, all at the source aspect ratio. A custom WxH is treated as a box -- the video is scaled to fit inside it keeping its aspect ratio, never stretched, and never made larger than the source."
    configuration:
      match_media: "input_video"

  - name: "quality"
    type: "select"
    formula: "resize"
    label: "Quality"
    default: "balanced"
    ai_hint: "H.264 quality. High keeps the most detail with a bigger file, Balanced suits most uses, Small file gives the smallest file with visible softening."
    configuration:
      options:
        - { label: "High", value: "high", sub_label: "Most detail, bigger file." }
        - { label: "Balanced", value: "balanced", sub_label: "Good detail at a moderate size." }
        - { label: "Small file", value: "small", sub_label: "Smallest file, softer picture." }
