fields:
  - name: "source_video"
    type: "video"
    label: "Video"
    required: true
    description: "The performance to keep."
    ai_hint: "The clip whose main person is replaced. Its camera, motion, timing and setting are kept; MiniMax-H3 reads it as <Video 1> of a video-editing request. Up to 14 seconds are used."
  - name: "character"
    type: "image"
    label: "Character"
    required: true
    description: "One to four pictures of who should appear."
    ai_hint: "Pictures of the person who takes over the performance. Several angles of the same person help likeness; all of them describe one character."
    configuration:
      multi: true
      max_items: 4
  - name: "character_description"
    type: "string"
    label: "Who they are"
    description: "Optional, e.g. a tall woman in a red coat."
    ai_hint: "A short plain description of the character's look, used to name them in the request. Leave empty to rely on the pictures."
    configuration:
      input_type: "textarea"
      rows: 2
  - name: "instruction"
    type: "string"
    label: "Anything else"
    description: "Optional extra direction."
    ai_hint: "Extra direction for the re-created clip, written as plain English, e.g. 'she smiles at the end'. Leave empty for a straight swap."
    configuration:
      input_type: "textarea"
      rows: 2
  - name: "keep_sound"
    type: "checkbox"
    label: "Keep original sound"
    default: true
