fields:
  - name: "source_video"
    type: "video"
    label: "Video"
    required: true
    description: "The performance to keep."
    ai_hint: "The clip whose main person is replaced. Its camera, motion, timing and setting are kept; MiniMax-H3 reads it as <Video 1> of a video-editing request. Up to 14 seconds are used."
  - name: "character"
    type: "image"
    label: "Character"
    required: true
    description: "One to four pictures of who should appear."
    ai_hint: "Pictures of the person who takes over the performance. Several angles of the same person help likeness; all of them describe one character."
    configuration:
      multi: true
      max_items: 4
  - name: "remove_background"
    type: "checkbox"
    label: "Remove the picture's background"
    default: true
    description: "Keeps only the person."
    ai_hint: "Cuts the person out of each character picture before MiniMax-H3 sees it, so the pictures' own backgrounds cannot leak into the video; the background always comes from the source video. Needs the Matting Model on the Generation tab. Leave it on unless the pictures already show the person on a plain background."
  - name: "keep_sound"
    type: "checkbox"
    label: "Keep original sound"
    default: true
