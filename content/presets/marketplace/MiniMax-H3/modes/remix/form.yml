name: "custom"
mode_label: "Remix video"
short_description: "Re-create a video with a change."
fields:
  - type: "tabs"
    children:
      - type: "tab"
        label: "Generation"
        configuration: {icon: "generation", icon_display: "icon_only"}
        children: "{{ paths.preset }}/modes/remix/tabs/generation.yml"
      - type: "tab"
        label: "References"
        configuration: {icon: "image", icon_display: "icon_only"}
        children: "{{ paths.preset }}/modes/remix/tabs/references.yml"
      - type: "tab"
        label: "LoRA"
        configuration: {icon: "lora", icon_display: "icon_only"}
        children: "{{ paths.preset }}/modes/video/tabs/lora.yml"
      - type: "tab"
        label: "Advanced"
        audience: "advanced"
        configuration: {icon: "settings", icon_display: "icon_only"}
        children: "{{ paths.preset }}/modes/video/tabs/advanced.yml"
