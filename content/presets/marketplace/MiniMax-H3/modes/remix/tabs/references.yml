fields:
  - name: "source_video"
    type: "video"
    label: "Video"
    required: true
    description: "The video to re-create."
    ai_hint: "The clip to remix. Its camera, motion and timing are kept and the change written in the prompt is applied; MiniMax-H3 reads it as <Video 1> of a video-editing request. Up to 14 seconds are used."
  - name: "pictures"
    type: "image"
    label: "Pictures"
    description: "Optional looks to borrow."
    ai_hint: "Optional pictures whose look the change should borrow, such as a costume, a style or a place."
    configuration:
      multi: true
      max_items: 4
  - name: "keep_sound"
    type: "checkbox"
    label: "Keep original sound"
    default: true
