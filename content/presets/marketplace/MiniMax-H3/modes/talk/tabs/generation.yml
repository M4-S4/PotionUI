fields:
  - name: "speed_profile"
    type: "select"
    formula: "speed"
    label: "Speed"
    default: "quality"
    ai_hint: "Quality runs 24 steps and holds a likeness best; pick it whenever a face or outfit has to come back. Turbo runs 4 steps and drifts more. Custom hands the Steps slider on the Advanced tab to the user."
    configuration:
      options:
        - { label: "Quality (24 steps)", value: "quality" }
        - { label: "Turbo (4 steps)", value: "turbo" }
        - { label: "Custom (set Steps yourself)", value: "custom" }
  - type: "section"
    label: "Video"
    children:
      - name: "portrait"
        type: "image"
        label: "Portrait"
        required: true
        description: "Who speaks."
        ai_hint: "A clear picture of the person who speaks. The video takes this picture's aspect ratio."
      - name: "voice"
        type: "audio"
        label: "Voice"
        required: true
        description: "The speech to lip-sync."
        ai_hint: "The speech the person says, reused exactly. The video is as long as this clip, up to Max length."
      - name: "words"
        type: "string"
        label: "Words"
        description: "Optional transcript of the voice clip."
        ai_hint: "What the voice clip says, verbatim. It helps the lips match; leave empty if unknown."
        configuration:
          input_type: "textarea"
          rows: 2
      - name: "scene"
        type: "string"
        label: "Scene"
        description: "Optional, e.g. talking to the camera in a cafe."
        ai_hint: "Plain English: framing, place, mood and how the person moves while speaking."
        configuration:
          input_type: "textarea"
          rows: 2
      - name: "max_seconds"
        type: "slider"
        formula: "size"
        label: "Max length (seconds)"
        default: 14
        description: "Longer voice clips are cut here."
        ai_hint: "The clip follows the voice clip length, up to this many seconds."
        configuration: {min: 1, max: 14, step: 0.5}
      - type: "row"
        children:
          - name: "seed"
            type: "seed"
            label: "Seed"
            default: -1
            width: "3/5"
          - name: "quantity"
            type: "stepper"
            label: "Quantity"
            default: 1
            configuration: {min: 1, max: 4, step: 1}
            width: "2/5"
            full_width: true
  - type: "section"
    label: "Models"
    formula: "models"
    children: "{{ paths.preset }}/files/form/models_ref2va.yml"
