fields:
  - type: "section"
    label: "Image"
    children:
      - type: "row"
        children: "{{ paths._shared }}/native/seed_quantity.yml"

      - name: "denoise"
        type: "slider"
        formula: "speed"
        label: "Denoising Strength"
        default: 0.55
        configuration:
          min: 0.0
          max: 1.0
          step: 0.05
          tooltip: "Fraction of the schedule to walk. Low (0.2-0.4) preserves structure and only refines; high (0.8-1.0) approaches a full re-render."

  - type: "section"
    label: "Models"
    formula: "models"
    children:
      - name: "diffusion_model"
        type: "model"
        label: "Diffusion Model"
        required: true
        configuration:
          model_type: "diffusion_model"
          placeholder: "Select a Flux1 DiT..."
          filter_tags: "@config:checkpoint_tags"

      - name: "text_encoder"
        type: "model"
        label: "Text Encoder"
        required: true
        configuration:
          model_type: "text_encoder"
          placeholder: "Select the T5-XXL text encoder..."
          filter_tags: "@config:text_encoder_tags"

      - name: "clip_l"
        type: "model"
        label: "CLIP-L"
        required: true
        configuration:
          model_type: "text_encoder"
          placeholder: "Select the CLIP-L text encoder..."
          filter_tags: "@config:text_encoder_tags"

      - name: "vae"
        type: "model"
        label: "VAE"
        required: true
        configuration:
          model_type: "vae"
          placeholder: "Select Flux VAE..."
          filter_tags: "@config:vae_tags"
