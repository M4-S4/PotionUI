name: "custom"
short_description: "Increase the resolution of a video."
negative_prompt:
  applies_when: { field: "cfg", greater_than: 1 }
fields:
  - type: "tabs"
    children:
      - type: "tab"
        label: "Generation"
        configuration:
          icon: "generation"
          icon_display: "icon_only"
        children: "{{ paths.preset }}/modes/upscale/tabs/generation.yml"
      - type: "tab"
        label: "References"
        configuration:
          icon: "image"
          icon_display: "icon_only"
        children: "{{ paths.preset }}/modes/upscale/tabs/references.yml"
      - type: "tab"
        label: "LoRA"
        configuration:
          icon: "lora"
          icon_display: "icon_only"
        children: "{{ paths.preset }}/modes/video/tabs/lora.yml"
      - type: "tab"
        label: "Enhance"
        configuration:
          icon: "sparkles"
          icon_display: "icon_only"
        children: "{{ paths.preset }}/modes/upscale/tabs/enhance.yml"
      - type: "tab"
        label: "Advanced"
        audience: "advanced"
        configuration:
          icon: "settings"
          icon_display: "icon_only"
        children: "{{ paths.preset }}/modes/upscale/tabs/advanced.yml"
