id: "video-producer"
name: "Video Producer"
version: "0.1.0"
description: "Storyboard, draft and final takes, editing, sound and delivery for AI video, driven by Video Director documents."
author: "M4-S4"
license: "GPL-3.0"
type: "full-stack"
category: "tools"

api:
  module: "backend/api.py"

presets:
  - path: "presets"

hooks:
  backend:
    - hook: "plugin.lifecycle.boot"
      handler: "hooks.lifecycle_hooks.on_boot"
    - hook: "plugin.lifecycle.ready"
      handler: "hooks.lifecycle_hooks.on_ready"
    - hook: "plugin.lifecycle.disable"
      handler: "hooks.lifecycle_hooks.on_disable"
    - hook: "notification_type.register"
      handler: "hooks.notification_hooks.register_types"
    - hook: "generation.after_complete"
      handler: "hooks.generation_hooks.on_after_complete"
    - hook: "generation.failed"
      handler: "hooks.generation_hooks.on_failed"

pages:
  - route: "video-producer"
    component: "VideoProducerPage.js"
    label: "Video Producer"
sidebar:
  - label: "Video Producer"
    route: "video-producer"
    icon: "M4 10h16v9a2 2 0 01-2 2H6a2 2 0 01-2-2v-9zM4 10l15.6-3.3-.7-3.4L3.3 6.6 4 10zM9.2 8.9l1.1-3.8M14.3 7.8l1.2-3.8"
    order: 80

tools:
  - class: "backend.chat.tools:WriteShotPromptTool"
    modes: ["video-producer"]
  - class: "backend.chat.tools:FixConflictsTool"
    modes: ["video-producer"]
  - class: "backend.chat.tools:SplitSynopsisTool"
    modes: ["video-producer"]
  - class: "backend.chat.tools:CheckContinuityTool"
    modes: ["video-producer"]

chat_modes:
  - id: "video-producer"
    name: "Video Producer assistant"
    description: "Writes shot prompts, fixes conflicts with the direction, cuts the synopsis into shots and checks continuity"
    icon: "film"
    default_route_prefixes:
      - "/plugins/video-producer"
    tools:
      - "vp_write_shot_prompt"
      - "vp_fix_conflicts"
      - "vp_split_synopsis"
      - "vp_check_continuity"
    context_contributor: "backend.chat.context.build_context"
    system_prompt: |
      You are the assistant of Video Producer, the page where the user storyboards, generates, edits and
      delivers an AI video, shot by shot. Every turn, a context block describes the project open on the
      page: its name and saved version, its prompt language, the synopsis, the global direction (universe,
      characters, photography, palette, rhythm and generation profile), the shots in timeline order with
      their id, stage, frames and instruction, the conflicts the page flags between an instruction and the
      direction, the continuity it measured between consecutive shots, and the production state. Ground
      every answer in that block, and name shots by their label. When it says the page is not open, ask
      the user to open a project in Video Producer before you use a tool.

      Prompt language: write every shot instruction, rewrite and proposed shot in the project's prompt
      language named in the context block, whatever language the user chats in, and answer the user in
      their own language. Never translate what the user wrote: keep their words as they are and write
      only what you add in the prompt language.

      A shot instruction says in one to three sentences what the camera sees in that shot: subject and
      action, framing, camera movement, light. It does not repeat the global direction, which is added to
      every shot, and never contradicts it.

      When to use the tools:
      - vp_write_shot_prompt: the user wants the instruction of one shot written, rewritten or improved.
      - vp_fix_conflicts: the context lists conflicts and the user wants them fixed; rewrite every
        conflicting instruction in a single call, keeping what each shot shows.
      - vp_split_synopsis: the user wants the synopsis, or a story they tell you, cut into shots (1 to 24
        shots, labels of at most 34 characters, 2 to 15 seconds each).
      - vp_check_continuity: the user asks about continuity, the cuts between shots or what to check
        before generating.

      You propose, the user approves. vp_write_shot_prompt, vp_fix_conflicts and vp_split_synopsis show
      the user a preview and change nothing until the user approves it; a split is then shown on the page
      as a proposal the user accepts there. Always call the tool instead of writing the new text in your
      reply, and never say a change is done before it is approved. vp_check_continuity only reads the
      project. When a tool answers project_not_found, shot_not_found or version_conflict, say so plainly
      and suggest reloading the project instead of calling it again.

      Available tools:
      {{TOOL_HINTS}}

limit_kinds:
  - key: "video-producer.gpu_minutes"
    label: "Video Producer GPU minutes per month"
    short_label: "Video Producer GPU minutes"
    description: "Estimated GPU minutes of the takes a user starts from Video Producer"
    value_type: "count"
    unit: "min per month"
    window: "month"
    enforce_at: ["submit"]
    ledger: false
    measure_handler: "backend.limit_handlers.ledger_total"
    applies_handler: "backend.limit_handlers.never_applies"

settings:
  - name: "draft_resolution"
    type: "select"
    label: "Draft resolution"
    default: "832x480"
    options:
      - { value: "832x480",  label: "832×480" }
      - { value: "960x544",  label: "960×544" }
      - { value: "1280x720", label: "1280×720" }
  - name: "max_parallel_jobs"
    type: "number"
    label: "Max generations in flight per user"
    default: 2
  - name: "export_dir_quota_mb"
    type: "number"
    label: "Export cache per user (MB)"
    default: 2048
  - name: "versions_kept"
    type: "number"
    label: "Versions kept per project"
    default: 50

setup:
  - kind: "check"
    check: "backend.setup_checks:VideoEngineReady"
    label: "Enable a native backend or a cloud video model"
  - kind: "check"
    check: "backend.setup_checks:VideoPresetsReady"
    label: "Install and assign at least one Video Director preset (Wan, MiniMax-H3, LTX or a cloud video preset)"
  - kind: "check"
    check: "backend.setup_checks:UpscalerReady"
    label: "Install SeedVR2 for final takes"
  - kind: "check"
    check: "backend.setup_checks:FfmpegReady"
    label: "Install ffmpeg for video delivery"
  - kind: "check"
    check: "backend.setup_checks:MiniMaxH3Ready"
    label: "If a MiniMax-H3 preset is installed, install its five model files (DiT, text encoder, video VAE, audio VAE, and the latent upscaler of its Upscale mode)"

docs:
  - path: "README.md"
    title: "Video Producer: administration"
    audience: "admin"
    order: 10
  - path: "docs/user-guide.md"
    title: "Video Producer: user guide"
    audience: "user"
    order: 20
  - path: "docs/user-guide.fr.md"
    title: "Video Producer : guide utilisateur"
    audience: "user"
    order: 21
