id: "video-producer"
name: "Video Producer"
version: "0.1.0"
description: "Storyboard, draft and final takes, editing, sound and delivery for AI video, driven by Video Director documents."
author: "M4-S4"
license: "GPL-3.0"
type: "full-stack"
category: "tools"

api:
  module: "backend/api.py"

hooks:
  backend:
    - hook: "plugin.lifecycle.boot"
      handler: "hooks.lifecycle_hooks.on_boot"
    - hook: "plugin.lifecycle.ready"
      handler: "hooks.lifecycle_hooks.on_ready"
    - hook: "plugin.lifecycle.disable"
      handler: "hooks.lifecycle_hooks.on_disable"
    - hook: "notification_type.register"
      handler: "hooks.notification_hooks.register_types"

pages:
  - route: "video-producer"
    component: "VideoProducerPage.js"
    label: "Video Producer"
sidebar:
  - label: "Video Producer"
    route: "video-producer"
    icon: "M4 10h16v9a2 2 0 01-2 2H6a2 2 0 01-2-2v-9zM4 10l15.6-3.3-.7-3.4L3.3 6.6 4 10zM9.2 8.9l1.1-3.8M14.3 7.8l1.2-3.8"
    order: 80

limit_kinds:
  - key: "video-producer.gpu_minutes"
    label: "Video Producer GPU minutes per month"
    short_label: "Video Producer GPU minutes"
    description: "Estimated GPU minutes of the takes a user starts from Video Producer"
    value_type: "count"
    unit: "min per month"
    window: "month"
    enforce_at: ["submit"]
    ledger: false
    measure_handler: "backend.limit_handlers.ledger_total"
    applies_handler: "backend.limit_handlers.never_applies"

settings:
  - name: "draft_resolution"
    type: "select"
    label: "Draft resolution"
    default: "832x480"
    options:
      - { value: "832x480",  label: "832×480" }
      - { value: "960x544",  label: "960×544" }
      - { value: "1280x720", label: "1280×720" }
  - name: "max_parallel_jobs"
    type: "number"
    label: "Max generations in flight per user"
    default: 2
  - name: "export_dir_quota_mb"
    type: "number"
    label: "Export cache per user (MB)"
    default: 2048
  - name: "versions_kept"
    type: "number"
    label: "Versions kept per project"
    default: 50

setup:
  - kind: "check"
    check: "backend.setup_checks:VideoEngineReady"
    label: "Enable a native backend or a cloud video model"
  - kind: "check"
    check: "backend.setup_checks:VideoPresetsReady"
    label: "Install and assign at least one Video Director preset (Wan, MiniMax-H3, LTX or a cloud video preset)"
  - kind: "check"
    check: "backend.setup_checks:UpscalerReady"
    label: "Install SeedVR2 for final takes"
  - kind: "check"
    check: "backend.setup_checks:FfmpegReady"
    label: "Install ffmpeg for video delivery"
  - kind: "check"
    check: "backend.setup_checks:MiniMaxH3Ready"
    label: "If a MiniMax-H3 preset is installed, install its four model files (DiT, text encoder, video VAE, audio VAE)"

docs:
  - path: "README.md"
    title: "Video Producer: administration"
    audience: "admin"
    order: 10
  - path: "docs/user-guide.md"
    title: "Video Producer: user guide"
    audience: "user"
    order: 20
  - path: "docs/user-guide.fr.md"
    title: "Video Producer : guide utilisateur"
    audience: "user"
    order: 21
