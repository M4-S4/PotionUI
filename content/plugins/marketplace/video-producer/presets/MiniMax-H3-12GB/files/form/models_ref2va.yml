fields:
- name: model
  type: model
  label: MiniMax-H3 DiT (reference partition)
  required: true
  ai_hint: This mode requires the ref2va DiT (the reference-to-video partition, e.g. minimax_h3_ref2va_*), not the fl2va file
    the Video mode uses. Insist on the ref2va checkpoint and say why. The ref2va and fl2va files are byte-identical in architecture
    and key set, so PotionUI cannot detect a wrong pick — an fl2va DiT loads cleanly here and then silently generates a video
    that ignores the reference images entirely. If the user's picker only lists an fl2va file, tell them they need to download
    the ref2va partition; do not suggest running the reference mode on it.
  configuration:
    model_type: diffusion_model
    placeholder: "minimax_h3_ref2va_pruned_int8_convrot..."
    filter_tags: '@config:checkpoint_tags'
    recommendations:
    - name: "minimax_h3_ref2va_pruned_int8_convrot.safetensors"
      link: "https://huggingface.co/Comfy-Org/MiniMax-H3/resolve/main/diffusion_models/minimax_h3_ref2va_pruned_int8_convrot.safetensors"
      size: "19.53 GB"
      precision: "int8"
      sha256: "9255f52b6677845ad238f20dfaafa94727053694127ab7f255c048f0f9365779"
      description: "MiniMax-H3 reference-image to video+audio, pruned + int8 ConvRot - the 12 GB profile's DiT, no fp8 hardware needed."
    - name: "MiniMax-H3-Ref2VA-pruned_rank8_int8_convrot.safetensors"
      link: "https://huggingface.co/DeepBeepMeep/MiniMax-H3/resolve/main/MiniMax-H3-Ref2VA-pruned_rank8_int8_convrot.safetensors"
      size: "19.61 GB"
      precision: "int8"
      sha256: "e09db861c48d13560222948b4e38082bc21b1b7d4ddcaed9c865bf9c3233898c"
      description: "Wan2GP's pruned rank-8 int8 ConvRot repack of the Ref2VA DiT (DeepBeepMeep), under its Wan2GP file name - same size class as the Comfy-Org file."
- name: text_encoder
  type: model
  label: Text Encoder (Qwen3-VL-32B)
  required: true
  configuration:
    model_type: text_encoder
    placeholder: "qwen3vl_32b_minimax_h3_nvfp4_awq..."
    filter_tags: '@config:text_encoder_tags'
    recommendations:
    - name: "qwen3vl_32b_minimax_h3_nvfp4_awq.safetensors"
      link: "https://huggingface.co/Comfy-Org/MiniMax-H3/resolve/main/text_encoders/qwen3vl_32b_minimax_h3_nvfp4_awq.safetensors"
      size: "14.61 GB"
      sha256: "35a88d51044231fe332301d7a62aa81e3f2cba62febeb446e2c1e3e0ef76f2c6"
      description: "Qwen3-VL-32B encoder, nvfp4 AWQ - larger than a 12 GB card, so the 12 GB profile streams it from system RAM."
- name: video_vae
  type: model
  label: Video VAE
  required: true
  configuration:
    model_type: vae
    placeholder: "minimax_h3_video_vae_int8_convrot..."
    filter_tags: '@config:vae_tags'
    recommendations:
    - name: "minimax_h3_video_vae_int8_convrot.safetensors"
      link: "https://huggingface.co/Comfy-Org/MiniMax-H3/resolve/main/vae/minimax_h3_video_vae_int8_convrot.safetensors"
      size: "2.62 GB"
      sha256: "52a2c8c73583c86e4f41cdcce3a6ad0ea562987bc0bf3d60a0cef5f5c8e60c0e"
      description: "MiniMax-H3 video VAE, int8 ConvRot - about half the fp16 file."
- name: audio_vae
  type: model
  label: Audio VAE
  required: true
  configuration:
    model_type: vae
    placeholder: minimax_h3_audio_vae...
    filter_tags: '@config:vae_tags'
    recommendations:
    - name: minimax_h3_audio_vae_fp32.safetensors
      link: https://huggingface.co/Comfy-Org/MiniMax-H3/resolve/main/vae/minimax_h3_audio_vae_fp32.safetensors
      size: 577.2 MB
      size_bytes: 605254808
      sha256: 8e505d95dd1561d47abd43d4238fd40d9bb1ae9e147ed0a4cba778d76ae4db48
      description: MiniMax-H3 audio VAE, fp32 - required for the audio track.
- name: flex_adapter
  type: model
  label: Flex adapter
  required: false
  ai_hint: The Pika Flex adapter for the reference DiT, used by the Flex speed profile only. It is applied on top of the DiT without reloading it. Use the ref2va file with this mode's DiT; a mismatched pair loads cleanly and gives a worse video.
  reactions:
  - when:
      field: speed_profile
      equals: flex
    then:
      set_visibility: true
      set_required: true
  - when:
      field: speed_profile
      not_equals: flex
    then:
      set_visibility: false
      set_required: false
  configuration:
    model_type: lora
    placeholder: pika_h3_flex_ref2va_v1_bf16...
    recommendations:
    - name: pika_h3_flex_ref2va_v1_bf16.safetensors
      link: https://huggingface.co/Comfy-Org/MiniMax-H3/resolve/main/loras/pika_h3_flex_ref2va_v1_bf16.safetensors
      size: 1.96 GB
      size_bytes: 1956172304
      precision: "bf16"
      sha256: de3745ceb7d8d5c20898dd8fa3a05f1c0b00089ccd55297b2a8bab95c766b0e0
      description: Pika H3 Flex reference adapter, bf16 (MiniMax H3 Community License).
- name: preview_decoder
  type: model
  label: Preview decoder
  required: false
  ai_hint: Optional tiny decoder that turns the live preview into a true-colour frame from the middle of the clip. Leave empty to keep the fast latent colour projection.
  reactions:
  - when:
      field: preview
      equals: false
    then:
      set_visibility: false
  - when:
      field: preview
      equals: true
    then:
      set_visibility: true
  configuration:
    model_type: preview_decoder
    placeholder: Select taeh3.safetensors...
    recommendations:
    - name: taeh3.safetensors
      link: https://raw.githubusercontent.com/madebyollin/taehv/62f7591f59dfbb4c3c02b7a621d180a9eeaba26c/safetensors/taeh3.safetensors
      size: 21.66 MB
      sha256: 4fd022bfcab08772fe0536b17ea1a3bbb5625be11e397868d1c5d891863d4c13
      description: MiniMax-H3 true-colour live preview decoder (MIT).
