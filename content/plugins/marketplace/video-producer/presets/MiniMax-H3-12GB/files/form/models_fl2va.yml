- name: flex_adapter
  type: model
  label: Flex adapter
  required: false
  ai_hint: The Pika Flex adapter for the first/last-frame DiT, used by the Flex speed profile only. It is applied on top of the DiT without reloading it. Use the fl2va file with this mode's DiT; a mismatched pair loads cleanly and gives a worse video.
  reactions:
  - when:
      field: speed_profile
      equals: flex
    then:
      set_visibility: true
      set_required: true
  - when:
      field: speed_profile
      not_equals: flex
    then:
      set_visibility: false
      set_required: false
  configuration:
    model_type: lora
    placeholder: pika_h3_flex_fl2va_v1_bf16...
    recommendations:
    - name: pika_h3_flex_fl2va_v1_bf16.safetensors
      link: https://huggingface.co/Comfy-Org/MiniMax-H3/resolve/main/loras/pika_h3_flex_fl2va_v1_bf16.safetensors
      size: 1.96 GB
      size_bytes: 1956172304
      precision: "bf16"
      sha256: cc5453aeecd6189468409003fe4cf1b57e52ff3a830a0a154b87decbe07358b7
      description: Pika H3 Flex first/last-frame adapter, bf16 (MiniMax H3 Community License).
- name: preview_decoder
  type: model
  label: Preview decoder
  required: false
  ai_hint: Optional tiny decoder that turns the live preview into a true-colour frame from the middle of the clip. Leave empty to keep the fast latent colour projection.
  reactions:
  - when:
      field: preview
      equals: false
    then:
      set_visibility: false
  - when:
      field: preview
      equals: true
    then:
      set_visibility: true
  configuration:
    model_type: preview_decoder
    placeholder: Select taeh3.safetensors...
    recommendations:
    - name: taeh3.safetensors
      link: https://raw.githubusercontent.com/madebyollin/taehv/62f7591f59dfbb4c3c02b7a621d180a9eeaba26c/safetensors/taeh3.safetensors
      size: 21.66 MB
      sha256: 4fd022bfcab08772fe0536b17ea1a3bbb5625be11e397868d1c5d891863d4c13
      description: MiniMax-H3 true-colour live preview decoder (MIT).
