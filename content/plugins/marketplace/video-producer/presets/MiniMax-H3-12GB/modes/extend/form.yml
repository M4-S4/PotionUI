name: "custom"
mode_label: "Continue a shot"
short_description: "Continue the end of a video with new footage, its motion and its sound carried over."
fields:
  - type: "tabs"
    children:
      - type: "tab"
        anchor: "generation"
        label: "Generation"
        configuration: {icon: "generation", icon_display: "icon_only"}
        children: "{{ paths.preset }}/modes/extend/tabs/generation.yml"
      - type: "tab"
        anchor: "references"
        label: "References"
        configuration: {icon: "image", icon_display: "icon_only"}
        children: "{{ paths.preset }}/modes/extend/tabs/references.yml"
      - type: "tab"
        anchor: "lora"
        label: "LoRA"
        configuration: {icon: "lora", icon_display: "icon_only"}
        children: "{{ paths._shared }}/../marketplace/MiniMax-H3/modes/video/tabs/lora.yml"
      - type: "tab"
        anchor: "advanced"
        label: "Advanced"
        audience: "advanced"
        configuration: {icon: "settings", icon_display: "icon_only"}
        children: "{{ paths.preset }}/modes/refs/tabs/advanced.yml"
