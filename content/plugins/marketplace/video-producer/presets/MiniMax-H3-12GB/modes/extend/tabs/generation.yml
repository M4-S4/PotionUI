fields:
  - name: "speed_profile"
    type: "select"
    formula: "speed"
    label: "Speed profile"
    default: "custom"
    ai_hint: "Quality runs 24 steps and holds the look of the source best. Turbo runs 4 steps and is softer. Flex runs 6 steps with the Pika Flex adapter, which needs the Flex adapter model on the Models section; it is fast, and it ignores the LoRA tab and the sampler settings. Custom hands the Steps slider on the Advanced tab to the user."
    configuration:
      options:
        - { label: "Quality", value: "quality", sub_label: "24 steps" }
        - { label: "Turbo", value: "turbo", sub_label: "4 steps" }
        - { label: "Flex", value: "flex", sub_label: "6 steps · Flex adapter" }
        - { label: "Custom", value: "custom", sub_label: "your own steps, left alone" }

  - type: "section"
    label: "Video"
    children:
      - type: "row"
        children:
          - name: "seed"
            type: "seed"
            label: "Seed"
            default: -1
            width: "3/5"

          - name: "quantity"
            type: "stepper"
            label: "Quantity"
            default: 1
            configuration: {min: 1, max: 4, step: 1}
            width: "2/5"
            full_width: true

      - name: "resolution"
        type: "resolution"
        formula: "size"
        label: "Resolution"
        ai_hint: "Both axes must be multiples of 32, aspect ratio between 1:4 and 4:1. The source is fitted onto this canvas, so keep the size of the clip it continues."
        configuration:
          files:
            - { path: "{{ paths._shared }}/resolutions/minimax_h3_canvas.yml", group: "Native canvas (768 short edge)" }
            - { path: "{{ paths._shared }}/resolutions/minimax_h3_fast.yml", group: "Faster (below native canvas)" }
            - { path: "{{ paths._shared }}/resolutions/minimax_h3_480p.yml", group: "480p (Flex-trained)" }
        default: "832x480"

      - name: "frames"
        type: "stepper"
        formula: "size"
        label: "New frames"
        default: 120
        description: "How many frames of new footage to add, at 24 fps."
        ai_hint: "Frames of new footage, at the fixed 24 fps, in one MiniMax-H3 window: 17 frames of the source are carried on top, so at most 328. The prompt describes only what happens in the new footage."
        configuration: {min: 17, max: 328, step: 1}

  - type: "section"
    label: "Models"
    formula: "models"
    children: "{{ paths.preset }}/files/form/models_fl2va.yml"
