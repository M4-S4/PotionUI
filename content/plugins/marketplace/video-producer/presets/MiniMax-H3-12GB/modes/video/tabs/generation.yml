fields:
  - name: "speed_profile"
    type: "select"
    formula: "speed"
    label: "Speed profile"
    default: "custom"
    ai_hint: >-
      Turbo is a 4-step recipe. It works on the base model alone — MiniMax-H3
      turns out to be a capable few-step generator on its own schedule — so no
      LoRA is required; expect softer detail than the 24-step Quality profile.
      The turbo distillation LoRA on the LoRA tab sharpens it further, but read
      that field's hint before loading one: the original ModelTC file omits its
      PEFT alpha metadata and produces noise unless its strength is set to 0.125
      by hand, while Kijai's conversion is correct at about 0.75. Pick Quality
      for anything final. Custom pins nothing and hands the Steps slider to the
      user — suggest it whenever they ask for a specific step count.
    configuration:
      options:
        - { label: "Quality", value: "quality", sub_label: "24 steps" }
        - { label: "Turbo", value: "turbo", sub_label: "4 steps · distillation LoRA optional" }
        - { label: "Custom", value: "custom", sub_label: "your own steps, left alone" }

  - type: "section"
    label: "Video"
    children:
      - type: "row"
        children:
          - name: "seed"
            type: "seed"
            label: "Seed"
            default: -1
            width: "3/5"

          - name: "quantity"
            type: "stepper"
            label: "Quantity"
            default: 1
            configuration: {min: 1, max: 4, step: 1}
            width: "2/5"
            full_width: true

      - name: "resolution"
        type: "resolution"
        formula: "size"
        label: "Resolution"
        ai_hint: "Both axes must be multiples of 32, aspect ratio between 1:4 and 4:1 — the offered sizes are what MiniMax-H3's own canvas math produces. Area is the dominant cost."
        configuration:
          files:
            - { path: "{{ paths._shared }}/resolutions/minimax_h3_canvas.yml", group: "Native canvas (768 short edge)" }
            - { path: "{{ paths._shared }}/resolutions/minimax_h3_fast.yml", group: "Faster (below native canvas)" }
        default: "832x480"

  - type: "section"
    label: "Models"
    formula: "models"
    children:
      - name: "model"
        type: "model"
        label: "MiniMax-H3 DiT"
        required: true
        configuration:
          model_type: "diffusion_model"
          placeholder: "minimax_h3_fl2va_pruned_int8_convrot..."
          filter_tags: "@config:checkpoint_tags"
          recommendations:
            - name: "minimax_h3_fl2va_pruned_int8_convrot.safetensors"
              link: "https://huggingface.co/Comfy-Org/MiniMax-H3/resolve/main/diffusion_models/minimax_h3_fl2va_pruned_int8_convrot.safetensors"
              size: "19.53 GB"
              sha256: "e889202c41dafb67b10d67b97f0d8541508036a6090af23425a5c2615d03c47a"
              description: "MiniMax-H3 first/last-frame to video+audio, pruned + int8 ConvRot - the 12 GB profile's DiT, no fp8 hardware needed."
            - name: "MiniMax-H3-FL2VA-pruned_rank8_int8_convrot.safetensors"
              link: "https://huggingface.co/DeepBeepMeep/MiniMax-H3/resolve/main/MiniMax-H3-FL2VA-pruned_rank8_int8_convrot.safetensors"
              size: "19.61 GB"
              sha256: "30ff400f974b11a1ef13d216c5d9f6439a9c10322a3988b0374a39672ce286f0"
              description: "Wan2GP's pruned rank-8 int8 ConvRot repack of the FL2VA DiT (DeepBeepMeep), under its Wan2GP file name - same size class as the Comfy-Org file."

      - name: "text_encoder"
        type: "model"
        label: "Text Encoder (Qwen3-VL-32B)"
        required: true
        configuration:
          model_type: "text_encoder"
          placeholder: "qwen3vl_32b_minimax_h3_nvfp4_awq..."
          filter_tags: "@config:text_encoder_tags"
          recommendations:
            - name: "qwen3vl_32b_minimax_h3_nvfp4_awq.safetensors"
              link: "https://huggingface.co/Comfy-Org/MiniMax-H3/resolve/main/text_encoders/qwen3vl_32b_minimax_h3_nvfp4_awq.safetensors"
              size: "14.61 GB"
              sha256: "35a88d51044231fe332301d7a62aa81e3f2cba62febeb446e2c1e3e0ef76f2c6"
              description: "Qwen3-VL-32B encoder, nvfp4 AWQ - larger than a 12 GB card, so the 12 GB profile streams it from system RAM."

      - name: "video_vae"
        type: "model"
        label: "Video VAE"
        required: true
        configuration:
          model_type: "vae"
          placeholder: "minimax_h3_video_vae_int8_convrot..."
          filter_tags: "@config:vae_tags"
          recommendations:
            - name: "minimax_h3_video_vae_int8_convrot.safetensors"
              link: "https://huggingface.co/Comfy-Org/MiniMax-H3/resolve/main/vae/minimax_h3_video_vae_int8_convrot.safetensors"
              size: "2.62 GB"
              sha256: "52a2c8c73583c86e4f41cdcce3a6ad0ea562987bc0bf3d60a0cef5f5c8e60c0e"
              description: "MiniMax-H3 video VAE, int8 ConvRot - about half the fp16 file."

      - name: "audio_vae"
        type: "model"
        label: "Audio VAE"
        required: true
        configuration:
          model_type: "vae"
          placeholder: "minimax_h3_audio_vae..."
          filter_tags: "@config:vae_tags"
          recommendations:
            - name: "minimax_h3_audio_vae_fp32.safetensors"
              link: "https://huggingface.co/Comfy-Org/MiniMax-H3/resolve/main/vae/minimax_h3_audio_vae_fp32.safetensors"
              size: "577.2 MB"
              sha256: "8e505d95dd1561d47abd43d4238fd40d9bb1ae9e147ed0a4cba778d76ae4db48"
              description: "MiniMax-H3 audio VAE, fp32 - required for the audio track."
