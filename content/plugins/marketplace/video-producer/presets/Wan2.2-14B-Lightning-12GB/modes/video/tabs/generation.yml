fields:
  - name: "speed_profile"
    type: "select"
    formula: "speed"
    label: "Speed"
    default: "fast"
    configuration:
      options:
        - { label: "Lightning (6 steps)", value: "fast", sub_label: "(6 steps, CFG 1, with the lightx2v LoRA pair)" }
        - { label: "Custom", value: "custom", sub_label: "(set steps/CFG freely)" }

  - type: "section"
    label: "Video"
    children:
      - name: "seed"
        type: "seed"
        label: "Seed"
        default: -1

      - name: "resolution"
        type: "resolution"
        formula: "size"
        label: "Resolution"
        configuration:
          files:
            - { path: "{{ paths._shared }}/resolutions/video.yml", group: "Video" }
            - { path: "{{ paths._shared }}/resolutions/social_media_video.yml", group: "Social Media" }
        default: "832x480"

      - name: "fps"
        type: "slider"
        formula: "size"
        label: "FPS"
        default: 16
        configuration: {min: 1, max: 60, step: 1}

  - type: "section"
    label: "Text Encoder & VAE"
    formula: "models"
    children:
      - name: "text_encoder"
        type: "model"
        label: "Text Encoder (UMT5-XXL)"
        required: true
        configuration:
          model_type: "text_encoder"
          placeholder: "Select UMT5-XXL..."
          filter_tags: "@config:text_encoder_tags"
          recommendations:
            - name: "umt5_xxl_fp8_e4m3fn_scaled.safetensors"
              link: "https://huggingface.co/Comfy-Org/Wan_2.2_ComfyUI_Repackaged/resolve/main/split_files/text_encoders/umt5_xxl_fp8_e4m3fn_scaled.safetensors"
              size: "6.27 GB"
              sha256: "c3355d30191f1f066b26d93fba017ae9809dce6c627dda5f6a66eaa651204f68"
              description: "UMT5-XXL text encoder, fp8-scaled - the practical default."

      - name: "vae"
        type: "model"
        label: "VAE"
        required: true
        configuration:
          model_type: "vae"
          placeholder: "Select Wan VAE..."
          filter_tags: "@config:vae_tags"
          recommendations:
            - name: "wan_2.1_vae.safetensors"
              link: "https://huggingface.co/Comfy-Org/Wan_2.2_ComfyUI_Repackaged/resolve/main/split_files/vae/wan_2.1_vae.safetensors"
              size: "242.1 MB"
              sha256: "2fc39d31359a4b0a64f55876d8ff7fa8d780956ae2cb13463b0223e15148976b"
              description: "VAE for the Wan 2.1 and Wan 2.2 14B checkpoints."
