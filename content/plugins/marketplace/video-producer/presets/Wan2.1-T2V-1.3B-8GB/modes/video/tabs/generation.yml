fields:
  - name: "speed_profile"
    type: "select"
    formula: "speed"
    label: "Speed profile"
    default: "balanced"
    configuration:
      options:
        - { label: "Balanced (30 steps)", value: "balanced", sub_label: "30 steps" }
        - { label: "Custom", value: "custom", sub_label: "(set steps/CFG freely)" }

  - type: "section"
    label: "Video"
    children:
      - name: "seed"
        type: "seed"
        label: "Seed"
        default: -1

      - name: "resolution"
        type: "resolution"
        formula: "size"
        label: "Resolution"
        configuration:
          files:
            - { path: "{{ paths.preset }}/files/form/resolutions_480p.yml", group: "480p" }
        default: "832x480"

      - name: "fps"
        type: "slider"
        formula: "size"
        label: "FPS"
        default: 16
        configuration: {min: 1, max: 60, step: 1}

  - type: "section"
    label: "Models"
    formula: "models"
    children:
      - name: "t2v_high_noise_model"
        type: "model"
        label: "t2v DiT (high-noise / single)"
        configuration:
          model_type: "diffusion_model"
          placeholder: "Wan t2v DiT — high-noise expert, or the only DiT..."
          filter_tags: "@config:checkpoint_tags"
          recommendations:
            - name: "wan2.1_t2v_1.3B_fp16.safetensors"
              link: "https://huggingface.co/Comfy-Org/Wan_2.1_ComfyUI_repackaged/resolve/main/split_files/diffusion_models/wan2.1_t2v_1.3B_fp16.safetensors"
              size: "2.64 GB"
              sha256: "be531024cd9018cb5b48c40cfbb6a6191645b1c792eb8bf4f8c1c6e10f924dc5"
              description: "Wan 2.1 T2V 1.3B, fp16 - a single DiT that stays whole on an 8 GB card. Leave the low-noise picker empty."

      - name: "t2v_low_noise_model"
        type: "model"
        label: "t2v DiT (low-noise expert)"
        configuration:
          model_type: "diffusion_model"
          placeholder: "Leave empty: the 1.3B is a single DiT..."
          filter_tags: "@config:checkpoint_tags"

      - name: "i2v_high_noise_model"
        type: "model"
        label: "i2v DiT (high-noise / single)"
        visible: false
        configuration:
          model_type: "diffusion_model"
          placeholder: "Wan i2v DiT — high-noise expert, or the only DiT..."
          filter_tags: "@config:checkpoint_tags"
          recommendations:
            - name: "wan2.2_i2v_high_noise_14B_fp8_scaled.safetensors"
              link: "https://huggingface.co/Comfy-Org/Wan_2.2_ComfyUI_Repackaged/resolve/main/split_files/diffusion_models/wan2.2_i2v_high_noise_14B_fp8_scaled.safetensors"
              size: "13.31 GB"
              sha256: "6122e79d55e0f235698d11d657f3b196c5273c830da00b2b013c5a048d5e6a42"
              description: "Wan 2.2 14B i2v high-noise expert, fp8-scaled - half the bf16 footprint."
            - name: "wan2.2_i2v_high_noise_14B_fp16.safetensors"
              link: "https://huggingface.co/Comfy-Org/Wan_2.2_ComfyUI_Repackaged/resolve/main/split_files/diffusion_models/wan2.2_i2v_high_noise_14B_fp16.safetensors"
              size: "26.62 GB"
              sha256: "c21c21efa368d529a982a7d89dd11d86608b5937cae9a125d0ffe5491918a100"
              description: "Wan 2.2 14B i2v high-noise expert, full-precision reference."
            - name: "wan2.2_ti2v_5B_fp16.safetensors"
              link: "https://huggingface.co/Comfy-Org/Wan_2.2_ComfyUI_Repackaged/resolve/main/split_files/diffusion_models/wan2.2_ti2v_5B_fp16.safetensors"
              size: "9.31 GB"
              sha256: "456f901338bd9eadbded3828b819109a9b68e8a525ca5cf8d0049a69fcfeca1e"
              description: "Wan 2.2 5B TI2V - image-to-video and Director shots from a start image or the previous shot's last frame, which becomes its first latent frame. No first+last-frame (flf). Leave the low-noise picker empty and use wan2.2_vae. Director continuations carry one motion latent by default and refuse more."

      - name: "i2v_low_noise_model"
        type: "model"
        label: "i2v DiT (low-noise expert)"
        visible: false
        configuration:
          model_type: "diffusion_model"
          placeholder: "Wan 2.2 i2v low-noise expert — leave empty for 2.1 / 5B..."
          filter_tags: "@config:checkpoint_tags"
          recommendations:
            - name: "wan2.2_i2v_low_noise_14B_fp8_scaled.safetensors"
              link: "https://huggingface.co/Comfy-Org/Wan_2.2_ComfyUI_Repackaged/resolve/main/split_files/diffusion_models/wan2.2_i2v_low_noise_14B_fp8_scaled.safetensors"
              size: "13.31 GB"
              sha256: "5471a457b6ac404202a5fbe6c11595a3d5641fc766b00f38763f72303fffc21e"
              description: "Wan 2.2 14B i2v low-noise expert, fp8-scaled. Pair with the high-noise file above."
            - name: "wan2.2_i2v_low_noise_14B_fp16.safetensors"
              link: "https://huggingface.co/Comfy-Org/Wan_2.2_ComfyUI_Repackaged/resolve/main/split_files/diffusion_models/wan2.2_i2v_low_noise_14B_fp16.safetensors"
              size: "26.62 GB"
              sha256: "edb89340c8a6fbf1a70e76a839ae01eaf7d289f05ea1ebd6b1a3fc6f533826e9"
              description: "Wan 2.2 14B i2v low-noise expert, full-precision reference."

      - name: "text_encoder"
        type: "model"
        label: "Text Encoder (UMT5-XXL)"
        required: true
        configuration:
          model_type: "text_encoder"
          placeholder: "Select UMT5-XXL..."
          filter_tags: "@config:text_encoder_tags"
          recommendations:
            - name: "umt5_xxl_fp8_e4m3fn_scaled.safetensors"
              link: "https://huggingface.co/Comfy-Org/Wan_2.2_ComfyUI_Repackaged/resolve/main/split_files/text_encoders/umt5_xxl_fp8_e4m3fn_scaled.safetensors"
              size: "6.27 GB"
              sha256: "c3355d30191f1f066b26d93fba017ae9809dce6c627dda5f6a66eaa651204f68"
              description: "UMT5-XXL text encoder, fp8-scaled - the only text encoder this 8 GB profile loads."

      - name: "vae"
        type: "model"
        label: "VAE"
        required: true
        configuration:
          model_type: "vae"
          placeholder: "Select Wan VAE..."
          filter_tags: "@config:vae_tags"
          recommendations:
            - name: "wan_2.1_vae.safetensors"
              link: "https://huggingface.co/Comfy-Org/Wan_2.2_ComfyUI_Repackaged/resolve/main/split_files/vae/wan_2.1_vae.safetensors"
              size: "242.1 MB"
              sha256: "2fc39d31359a4b0a64f55876d8ff7fa8d780956ae2cb13463b0223e15148976b"
              description: "The Wan 2.1 VAE, the one the 1.3B checkpoint decodes with."

      - name: "preview_decoder"
        type: "model"
        label: "Preview decoder"
        required: false
        ai_hint: "Optional tiny decoder that turns the live preview into a true-colour frame from the middle of the clip. Leave empty to keep the fast latent colour projection."
        configuration:
          model_type: "preview_decoder"
          placeholder: "Select taew2_1.safetensors..."
          recommendations:
            - name: "taew2_1.safetensors"
              link: "https://raw.githubusercontent.com/madebyollin/taehv/62f7591f59dfbb4c3c02b7a621d180a9eeaba26c/safetensors/taew2_1.safetensors"
              size: "21.59 MB"
              sha256: "04766eac0221b5390b985ae3fdcca652cbb4b1e8b82b28ea7ff89dfad1b1a93f"
              description: "Wan 2.1, Wan 2.2 14B and Qwen-Image true-colour live preview decoder (MIT)."
            - name: "taew2_2.safetensors"
              link: "https://raw.githubusercontent.com/madebyollin/taehv/62f7591f59dfbb4c3c02b7a621d180a9eeaba26c/safetensors/taew2_2.safetensors"
              size: "21.79 MB"
              sha256: "b84609b2a133d48434bd9636bfcb44bf05168dc436e2d3cecf26256faa1f5325"
              description: "Wan 2.2 5B true-colour live preview decoder (MIT)."
