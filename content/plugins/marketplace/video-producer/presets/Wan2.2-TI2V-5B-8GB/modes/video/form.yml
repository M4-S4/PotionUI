name: "custom"
short_description: "Generate a 480p video at 24 fps from a prompt on an 8 GB card."
fields:
  - type: "tabs"
    children:
      - type: "tab"
        label: "Generation"
        configuration: {icon: "generation", icon_display: "icon_only"}
        children: "{{ paths.preset }}/modes/video/tabs/generation.yml"
      - type: "tab"
        label: "LoRA"
        configuration: {icon: "lora", icon_display: "icon_only"}
        children: "{{ paths.preset }}/modes/video/tabs/lora.yml"
      - type: "tab"
        label: "SVI Pro"
        visible: false
        configuration: {icon: "film", icon_display: "icon_only"}
        children: "{{ paths._shared }}/../marketplace/Wan/modes/video/tabs/svi_pro.yml"
      - type: "tab"
        label: "Advanced"
        audience: "advanced"
        configuration: {icon: "settings", icon_display: "icon_only"}
        children: "{{ paths._shared }}/../marketplace/Wan/modes/video/tabs/advanced.yml"
