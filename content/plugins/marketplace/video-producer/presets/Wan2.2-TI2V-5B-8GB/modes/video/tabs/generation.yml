fields:
  - name: "speed_profile"
    type: "select"
    formula: "speed"
    label: "Speed"
    default: "balanced"
    configuration:
      options:
        - { label: "Balanced (30 steps)", value: "balanced", sub_label: "30 steps" }
        - { label: "Custom", value: "custom", sub_label: "(set steps/CFG freely)" }

  - type: "section"
    label: "Video"
    children:
      - name: "seed"
        type: "seed"
        label: "Seed"
        default: -1

      - name: "resolution"
        type: "resolution"
        formula: "size"
        label: "Resolution"
        configuration:
          files:
            - { path: "{{ paths.preset }}/files/form/resolutions_480p.yml", group: "480p" }
        default: "832x480"

      - name: "fps"
        type: "slider"
        formula: "size"
        label: "FPS"
        default: 24
        configuration: {min: 1, max: 60, step: 1}

  - type: "section"
    label: "Text Encoder & VAE"
    formula: "models"
    children:
      - name: "text_encoder"
        type: "model"
        label: "Text Encoder (UMT5-XXL)"
        required: true
        configuration:
          model_type: "text_encoder"
          placeholder: "Select UMT5-XXL..."
          filter_tags: "@config:text_encoder_tags"
          recommendations:
            - name: "umt5_xxl_fp8_e4m3fn_scaled.safetensors"
              link: "https://huggingface.co/Comfy-Org/Wan_2.2_ComfyUI_Repackaged/resolve/main/split_files/text_encoders/umt5_xxl_fp8_e4m3fn_scaled.safetensors"
              size: "6.27 GB"
              sha256: "c3355d30191f1f066b26d93fba017ae9809dce6c627dda5f6a66eaa651204f68"
              description: "UMT5-XXL text encoder, fp8-scaled - the only text encoder this 8 GB profile loads."

      - name: "vae"
        type: "model"
        label: "VAE"
        required: true
        configuration:
          model_type: "vae"
          placeholder: "Select Wan VAE..."
          filter_tags: "@config:vae_tags"
          recommendations:
            - name: "wan2.2_vae.safetensors"
              link: "https://huggingface.co/Comfy-Org/Wan_2.2_ComfyUI_Repackaged/resolve/main/split_files/vae/wan2.2_vae.safetensors"
              size: "1.31 GB"
              sha256: "e40321bd36b9709991dae2530eb4ac303dd168276980d3e9bc4b6e2b75fed156"
              description: "The Wan 2.2 VAE (48 channels), the one the 5B TI2V decodes with - not interchangeable with the 2.1 VAE."
