  - key: "models.index"
    kind: "models.index"
    title: "Find models you already have"
    params:
      engine: "native"
  - key: "artifacts.plan"
    kind: "artifacts.plan"
    title: "Plan required downloads"
    params:
      artifact_ids: ["wan22-i2v-high", "wan22-i2v-low", "umt5-text-encoder", "wan21-vae", "lightx2v-i2v-high", "lightx2v-i2v-low"]
  - key: "artifacts.fetch"
