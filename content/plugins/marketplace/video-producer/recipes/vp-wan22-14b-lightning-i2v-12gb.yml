schema_version: 1
id: "vp-wan22-14b-lightning-i2v-12gb"
version: 1
name: "Wan 2.2 14B Lightning I2V (12 GB)"
engine: "native"
category: "video"
summary: "Set up Wan 2.2's 14B image-to-video pair with the lightx2v image-to-video LoRAs for a 12 GB card, so Video Producer starts the shots of the Lightning preset from an image."
description: >
  Installs the Video Producer preset Wan 2.2 14B Lightning I2V (12 GB) on the native engine and makes
  sure its six files are available: the 14B image-to-video high-noise and low-noise experts in fp8, the
  fp8 UMT5-XXL text encoder, the Wan 2.1 VAE and the lightx2v 4-step image-to-video LoRA pair, about 38 GB
  together. The text encoder and the VAE are those of the recipe vp-wan22-14b-lightning-12gb and the
  experts those of vp-wan22-14b-i2v: what one of them already installed is found by its sha256 and not
  downloaded again (31 GB more after the Lightning recipe, 2.45 GB after both). Video Producer hands this
  preset the shots of Wan 2.2 14B Lightning (12 GB) that start from an image. No first generation: the
  preset only runs from an image, and the recipe runner has none to give it. Weights and LoRAs:
  Apache-2.0.

plugins:
  - id: "huggingface-provider"
    reason: >
      Resolves every file from Hugging Face by its exact repository path; the sha256 of each artifact
      verifies the download.
  - id: "video-producer"
    reason: "Ships this recipe and the hardware-tier presets it installs."

backend:
  engine: "native"

