schema_version: 1
id: "vp-wan22-14b-lightning-12gb"
version: 1
name: "Wan 2.2 14B Lightning (12 GB)"
engine: "native"
category: "video"
summary: "Set up Wan 2.2's 14B text-to-video pair with the lightx2v Lightning LoRAs for a 12 GB card, 6 steps per clip."
description: >
  Installs the Video Producer preset Wan 2.2 14B Lightning (12 GB) on the native engine, makes sure
  its six files are available (the 14B high-noise and low-noise experts in fp8, the fp8 UMT5-XXL text
  encoder, the Wan 2.1 VAE and the lightx2v 4-step LoRA pair, about 38 GB together) and runs a first
  real generation. Text to video only. The preset declares the system RAM it was measured with.
  Weights and LoRAs: Apache-2.0.

plugins:
  - id: "huggingface-provider"
    reason: >
      Resolves every file from Hugging Face by its exact repository path; the sha256 of each artifact
      verifies the download.
  - id: "video-producer"
    reason: "Ships this recipe and the hardware-tier presets it installs."

backend:
  engine: "native"

artifacts:
  - id: "wan22-t2v-high"
    kind: "diffusion_model"
    model_type: "diffusion_model"
    filename: "wan2.2_t2v_high_noise_14B_fp8_scaled.safetensors"
    display_name: "Wan 2.2 14B t2v DiT - high-noise expert (fp8-scaled)"
    required: true
    size_bytes: 14293923632
    checksum:
      algorithm: "sha256"
