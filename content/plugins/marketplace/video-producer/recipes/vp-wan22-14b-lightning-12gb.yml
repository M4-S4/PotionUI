presets:
  - preset_id: "01M57QPEMDPKHHW83YSEYBN0X1"
    path_hint: "video-producer/Wan2.2-14B-Lightning-12GB"
    assign_to_owner: true

smoke:
  preset_id: "01M57QPEMDPKHHW83YSEYBN0X1"
  mode: "video"
  timeout_seconds: 600
  prompt: "a paper boat drifting down a rain-filled gutter, close-up, soft afternoon light"
  seed: 12345
  form:
    resolution: "832x480"
    speed_profile: "fast"
    video_director:
      schema_version: 1
      mode: "t2v"
      settings:
        fps: 16
        duration: 1
        resolution: "832x480"
        seed: 12345
      segments:
        - id: "shot-1"
          prompt: "a paper boat drifting down a rain-filled gutter, close-up, soft afternoon light"
          negative_prompt: ""
      media: []

steps:
  - key: "plugins.ensure"
    kind: "plugins.ensure"
    title: "Enable required plugins"
    params:
      plugin_ids: ["huggingface-provider"]
  - key: "backend.ensure"
    kind: "backend.ensure"
    title: "Prepare the native backend"
    params:
      engine: "native"
  - key: "models.index"
    kind: "models.index"
    title: "Find models you already have"
    params:
      engine: "native"
  - key: "artifacts.plan"
    kind: "artifacts.plan"
    title: "Plan required downloads"
    params:
      artifact_ids: ["wan22-t2v-high", "wan22-t2v-low", "umt5-text-encoder", "wan21-vae", "lightx2v-t2v-high", "lightx2v-t2v-low"]
  - key: "artifacts.fetch"
    kind: "artifacts.fetch"
    title: "Download the Wan 2.2 14B and Lightning files"
    params:
      artifact_ids: ["wan22-t2v-high", "wan22-t2v-low", "umt5-text-encoder", "wan21-vae", "lightx2v-t2v-high", "lightx2v-t2v-low"]
  - key: "models.index.downloads"
    kind: "models.index"
    title: "Register downloaded models"
    params:
      engine: "native"
  - key: "preset.ensure"
    kind: "preset.ensure"
    title: "Install and assign the Wan 2.2 14B Lightning (12 GB) preset"
    params:
      preset_id: "01M57QPEMDPKHHW83YSEYBN0X1"
  - key: "generation.smoke"
    kind: "generation.smoke"
    title: "Run a first real generation"
    params:
      preset_id: "01M57QPEMDPKHHW83YSEYBN0X1"
      mode: "video"
