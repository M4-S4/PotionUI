schema_version: 1
id: "vp-wan22-14b-i2v"
version: 1
name: "Wan 2.2 14B image to video"
engine: "native"
category: "video"
summary: "Complete the Wan 2.1 / 2.2 preset with its image-to-video expert pair, so Video Producer can start a shot from its first frame."
description: >
  Installs the core Wan 2.1 / 2.2 preset on the native engine and makes sure the six files of its 14B
  text-to-video and image-to-video models are available: both fp8 expert pairs, the fp8 UMT5-XXL text
  encoder and the Wan 2.1 VAE, about 64 GB together, of which the image-to-video pair is 28.6 GB. The
  first generation is a short text-to-video check; image to video runs when Video Producer binds a
  shot's first frame. Weights: Apache-2.0.

plugins:
  - id: "huggingface-provider"
    reason: >
      Resolves every file from Hugging Face by its exact repository path; the sha256 of each artifact
      verifies the download.
  - id: "video-producer"
    reason: "Ships this recipe and the hardware-tier presets it installs."

backend:
  engine: "native"

