presets:
  - preset_id: "01KX47WANVIDEO0000000000TV"
    path_hint: "marketplace/Wan"
    assign_to_owner: true

smoke:
  preset_id: "01KX47WANVIDEO0000000000TV"
  mode: "video"
  seed: 12345
  form:
    resolution: "480x832"
    steps: 6
    cfg: 1
    sampler: "euler"
    expert_boundary: 0.875
    video_director:
      schema_version: 1
      mode: "t2v"
      settings:
        fps: 16
        duration: 1
        resolution: "480x832"
        seed: 12345
      segments:
        - id: "shot-1"
          prompt: "a paper boat drifting down a rain-filled gutter, close-up, soft afternoon light"
          negative_prompt: ""
      media: []

steps:
  - key: "plugins.ensure"
    kind: "plugins.ensure"
    title: "Enable required plugins"
    params:
      plugin_ids: ["huggingface-provider"]
  - key: "backend.ensure"
    kind: "backend.ensure"
    title: "Prepare the native backend"
    params:
      engine: "native"
  - key: "models.index"
    kind: "models.index"
    title: "Find models you already have"
    params:
      engine: "native"
  - key: "artifacts.plan"
    kind: "artifacts.plan"
    title: "Plan required downloads"
    params:
      artifact_ids: ["wan22-t2v-high", "wan22-t2v-low", "wan22-i2v-high", "wan22-i2v-low", "umt5-text-encoder", "wan21-vae"]
  - key: "artifacts.fetch"
    kind: "artifacts.fetch"
    title: "Download the Wan 2.2 14B text-to-video and image-to-video files"
    params:
      artifact_ids: ["wan22-t2v-high", "wan22-t2v-low", "wan22-i2v-high", "wan22-i2v-low", "umt5-text-encoder", "wan21-vae"]
  - key: "models.index.downloads"
    kind: "models.index"
    title: "Register downloaded models"
    params:
      engine: "native"
  - key: "preset.ensure"
    kind: "preset.ensure"
    title: "Install and assign the Wan 2.1 / 2.2 preset"
    params:
      preset_id: "01KX47WANVIDEO0000000000TV"
  - key: "generation.smoke"
    kind: "generation.smoke"
    title: "Run a first real generation"
    params:
      preset_id: "01KX47WANVIDEO0000000000TV"
      mode: "video"
