schema_version: 1
id: "vp-minimax-h3-12gb"
version: 1
name: "MiniMax-H3 (12 GB)"
engine: "native"
category: "video"
summary: "Set up MiniMax-H3 video and sound for a 12 GB card, with the text encoder streamed from system RAM."
description: >
  Installs the Video Producer preset MiniMax-H3 (12 GB) on the native engine, makes sure its four
  files are available (the pruned int8 ConvRot DiT from Comfy-Org or Wan2GP, the nvfp4 Qwen3-VL-32B
  text encoder, the int8 ConvRot video VAE and the fp32 audio VAE, about 40 GB together). It runs no
  first generation: on a 12 GB card loading MiniMax-H3 takes longer than the five minutes the recipe
  runner gives one, so make a first take from Video Producer or the Generate page. Keep the native
  backend's text encoder placement on auto. WEIGHTS LICENSE: the MiniMax H3 Community License excludes
  the European Union, the United Kingdom, the United States and the Republic of Korea, outputs
  included; read the preset description before running this recipe.

plugins:
  - id: "huggingface-provider"
    reason: >
      Resolves every file from Hugging Face by its exact repository path; the sha256 of each artifact
      verifies the download.
  - id: "video-producer"
    reason: "Ships this recipe and the hardware-tier presets it installs."

backend:
  engine: "native"

artifacts:
  - id: "h3-diffusion-model"
    kind: "diffusion_model"
    model_type: "diffusion_model"
    display_name: "MiniMax-H3 DiT - first/last-frame to video+audio, pruned int8 ConvRot"
    required: true
    capability: "model-lookup"
    variants:
      - id: "comfy-org"
        label: "Comfy-Org"
        precision: "int8"
        filename: "minimax_h3_fl2va_pruned_int8_convrot.safetensors"
        size_bytes: 20970379616
        checksum:
          algorithm: "sha256"
          value: "e889202c41dafb67b10d67b97f0d8541508036a6090af23425a5c2615d03c47a"
        provider_hint:
          source: "huggingface"
          model_id: "Comfy-Org/MiniMax-H3"
          version_id: "main@diffusion_models/minimax_h3_fl2va_pruned_int8_convrot.safetensors"
        uploader: "Comfy-Org"
        source_url: "https://huggingface.co/Comfy-Org/MiniMax-H3"
        default: true
      - id: "wan2gp"
        label: "Wan2GP"
        precision: "int8"
        filename: "MiniMax-H3-FL2VA-pruned_rank8_int8_convrot.safetensors"
        size_bytes: 21057674787
        checksum:
          algorithm: "sha256"
          value: "30ff400f974b11a1ef13d216c5d9f6439a9c10322a3988b0374a39672ce286f0"
        provider_hint:
          source: "huggingface"
          model_id: "DeepBeepMeep/MiniMax-H3"
          version_id: "main@MiniMax-H3-FL2VA-pruned_rank8_int8_convrot.safetensors"
        uploader: "DeepBeepMeep"
        source_url: "https://huggingface.co/DeepBeepMeep/MiniMax-H3"
  - id: "h3-text-encoder"
    kind: "text_encoder"
    model_type: "text_encoder"
    filename: "qwen3vl_32b_minimax_h3_nvfp4_awq.safetensors"
    display_name: "Qwen3-VL-32B text encoder (nvfp4 AWQ)"
    required: true
    size_bytes: 15687142551
    checksum:
      algorithm: "sha256"
      value: "35a88d51044231fe332301d7a62aa81e3f2cba62febeb446e2c1e3e0ef76f2c6"
    capability: "model-lookup"
    provider_hint:
      source: "huggingface"
      model_id: "Comfy-Org/MiniMax-H3"
      version_id: "main@text_encoders/qwen3vl_32b_minimax_h3_nvfp4_awq.safetensors"
  - id: "h3-video-vae"
    kind: "vae"
    model_type: "vae"
    filename: "minimax_h3_video_vae_int8_convrot.safetensors"
    display_name: "MiniMax-H3 video VAE (int8 ConvRot)"
    required: true
    size_bytes: 2811065184
    checksum:
      algorithm: "sha256"
      value: "52a2c8c73583c86e4f41cdcce3a6ad0ea562987bc0bf3d60a0cef5f5c8e60c0e"
    capability: "model-lookup"
    provider_hint:
      source: "huggingface"
      model_id: "Comfy-Org/MiniMax-H3"
      version_id: "main@vae/minimax_h3_video_vae_int8_convrot.safetensors"
  - id: "h3-audio-vae"
    kind: "vae"
    model_type: "vae"
    filename: "minimax_h3_audio_vae_fp32.safetensors"
    display_name: "MiniMax-H3 audio VAE (fp32)"
    required: true
    size_bytes: 605254808
    checksum:
      algorithm: "sha256"
      value: "8e505d95dd1561d47abd43d4238fd40d9bb1ae9e147ed0a4cba778d76ae4db48"
    capability: "model-lookup"
    provider_hint:
      source: "huggingface"
      model_id: "Comfy-Org/MiniMax-H3"
      version_id: "main@vae/minimax_h3_audio_vae_fp32.safetensors"

presets:
  - preset_id: "01M54HN72B0KY7H63BKQ16T253"
    path_hint: "video-producer/MiniMax-H3-12GB"
    assign_to_owner: true

steps:
  - key: "plugins.ensure"
    kind: "plugins.ensure"
    title: "Enable required plugins"
    params:
      plugin_ids: ["huggingface-provider"]
  - key: "backend.ensure"
    kind: "backend.ensure"
    title: "Prepare the native backend"
    params:
      engine: "native"
  - key: "models.index"
    kind: "models.index"
    title: "Find models you already have"
    params:
      engine: "native"
  - key: "artifacts.plan"
    kind: "artifacts.plan"
    title: "Plan required downloads"
    params:
      artifact_ids: ["h3-diffusion-model", "h3-text-encoder", "h3-video-vae", "h3-audio-vae"]
  - key: "artifacts.fetch"
    kind: "artifacts.fetch"
    title: "Download the MiniMax-H3 12 GB files"
    params:
      artifact_ids: ["h3-diffusion-model", "h3-text-encoder", "h3-video-vae", "h3-audio-vae"]
  - key: "models.index.downloads"
    kind: "models.index"
    title: "Register downloaded models"
    params:
      engine: "native"
  - key: "preset.ensure"
    kind: "preset.ensure"
    title: "Install and assign the MiniMax-H3 (12 GB) preset"
    params:
      preset_id: "01M54HN72B0KY7H63BKQ16T253"
