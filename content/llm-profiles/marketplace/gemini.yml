version: 1
sources:
  gemini-interactions: https://ai.google.dev/gemini-api/docs/interactions
  gemini-thought-signatures: https://ai.google.dev/gemini-api/docs/thought-signatures
  gemini-function-calling: https://ai.google.dev/gemini-api/docs/function-calling
  gemini-caching: https://ai.google.dev/gemini-api/docs/caching
  gemini-3-guide: https://ai.google.dev/gemini-api/docs/gemini-3
  models-dev: https://models.dev/api.json
models_dev:
  google: gemini-interactions
rows:
  - id: gemini-interactions
    source: [gemini-interactions, gemini-function-calling, gemini-thought-signatures, gemini-caching]
    adapters: [gemini-interactions]
    fields:
      parallel_tools: true
      tool_choice: [auto, none, required, named]
      tool_choice_with_reasoning: [auto, none, required, named]
      structured_output: native
      vision: true
      interleaved_reasoning: true
      cache: automatic
  - id: gemini-3-and-4
    source: [gemini-interactions, gemini-caching]
    adapters: [gemini-interactions]
    models: ['^gemini-(3|4)']
    fields:
      reasoning: effort
      cache_min_tokens: 4096
  - id: gemini-3-temperature
    source: [gemini-3-guide]
    adapters: [gemini-interactions]
    models: ['^gemini-3']
    fields:
      recommended_sampling: {temperature: 1.0}
