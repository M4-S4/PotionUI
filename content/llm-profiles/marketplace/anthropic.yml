      context_window: 1000000
      max_output_tokens: 128000
      tools: true
      reasoning: effort
      reasoning_levels: [low, medium, high, xhigh, max]
      vision: true
      sampling_rejected: [temperature]
      prices: {input: 10, output: 50, cached_input: 1, cache_write: 12.5}
