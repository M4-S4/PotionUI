version: 1
sources:
  anthropic-thinking: https://platform.claude.com/docs/en/build-with-claude/thinking
  anthropic-prompt-caching: https://platform.claude.com/docs/en/build-with-claude/prompt-caching
  anthropic-parallel-tools: https://platform.claude.com/docs/en/agents-and-tools/tool-use/parallel-tool-use
  anthropic-tool-results: https://platform.claude.com/docs/en/agents-and-tools/tool-use/handle-tool-calls
  anthropic-migration: https://platform.claude.com/docs/en/api/migration-2026-10-21
  openai-reasoning: https://developers.openai.com/api/docs/guides/reasoning
  openai-migrate-to-responses: https://developers.openai.com/api/docs/guides/migrate-to-responses
  openai-function-calling: https://developers.openai.com/api/docs/guides/function-calling
  openai-prompt-caching: https://developers.openai.com/api/docs/guides/prompt-caching
  gemini-interactions: https://ai.google.dev/gemini-api/docs/interactions
  gemini-thought-signatures: https://ai.google.dev/gemini-api/docs/thought-signatures
  gemini-function-calling: https://ai.google.dev/gemini-api/docs/function-calling
  gemini-caching: https://ai.google.dev/gemini-api/docs/caching
  deepseek-thinking-mode: https://api-docs.deepseek.com/guides/thinking_mode
  deepseek-chat-completion: https://api-docs.deepseek.com/api/create-chat-completion
  ollama-thinking: https://docs.ollama.com/capabilities/thinking
  ollama-tool-calling: https://docs.ollama.com/capabilities/tool-calling
  ollama-renderers: https://github.com/ollama/ollama/tree/main/model/renderers
  qwen3-thinking-card: https://huggingface.co/Qwen/Qwen3-4B-Thinking-2507
  qwen3-6-card: https://huggingface.co/Qwen/Qwen3.6-35B-A3B
  qwen3-8-card: https://huggingface.co/Qwen/Qwen3.8-27B
  gemma-3-parameters: https://ollama.com/library/gemma3/blobs/3116c5225075
  gemma-4-card: https://huggingface.co/google/gemma-4-31B-it
  glm-4-7-card: https://huggingface.co/zai-org/GLM-4.7
  kimi-k2-thinking-card: https://huggingface.co/moonshotai/Kimi-K2-Thinking
  gemini-3-guide: https://ai.google.dev/gemini-api/docs/gemini-3
  gpt-oss-harmony: https://cookbook.openai.com/articles/openai-harmony
  glm-thinking-mode: https://docs.z.ai/guides/capabilities/thinking-mode
  kimi-thinking: https://platform.kimi.ai/docs/guide/use-kimi-k2-thinking-model
  minimax-m2-card: https://huggingface.co/MiniMaxAI/MiniMax-M2
  vllm-reasoning-outputs: https://docs.vllm.ai/en/latest/features/reasoning_outputs.html
  models-dev: https://models.dev/api.json
base:
  fields:
    context_window: null
    max_output_tokens: null
    tools: true
    prompt_tools: false
    parallel_tools: false
    tool_choice: [auto]
    tool_choice_with_reasoning: [auto]
    strict_tools: false
    tool_id_rule: passthrough
    structured_output: prompted
    reasoning: none
    reasoning_levels: []
    reasoning_toggle: null
    reasoning_field: null
    server: null
    replay: send_all
    replay_required_with_tools: false
    reasoning_prefix_bound: false
    interleaved_reasoning: false
    vision: false
    max_images: 1
    tool_result_media: false
    sampling_rejected: []
    sampling_ignored_with_reasoning: []
    recommended_sampling: {}
    cache: none
    cache_min_tokens: null
    prices: null
    verified: null
rows:
  - id: anthropic-messages
    source: [anthropic-parallel-tools, anthropic-tool-results, anthropic-prompt-caching, anthropic-migration]
    adapters: [anthropic-messages]
    fields:
      parallel_tools: true
      tool_choice: [auto, none, required, named]
      tool_choice_with_reasoning: [auto, none]
      strict_tools: true
      structured_output: native
      vision: true
      tool_result_media: true
      reasoning_prefix_bound: true
      cache: explicit
  - id: anthropic-5x
    source: [anthropic-thinking, anthropic-prompt-caching, anthropic-migration]
    adapters: [anthropic-messages]
    models: ['^claude-(opus|sonnet|haiku|fable|mythos)-(5|preview)(-|$)']
    fields:
      reasoning: effort
      reasoning_levels: [low, medium, high, xhigh, max]
      reasoning_toggle: thinking.type
      interleaved_reasoning: true
      tool_choice_with_reasoning: [auto, none, required, named]
      sampling_rejected: [temperature, top_p, top_k]
      cache_min_tokens: 512
  - id: anthropic-5x-thinking-cannot-be-disabled
    source: [anthropic-thinking]
    adapters: [anthropic-messages]
    models: ['^claude-(opus-5-5|sonnet-5-5|fable-5|mythos-5|mythos-preview)(-|$)']
    fields:
      reasoning_toggle: null
  - id: anthropic-5x-forced-tool-choice-rejected
    source: [anthropic-thinking]
    adapters: [anthropic-messages]
    models: ['^claude-(opus-5-5|sonnet-5-5|fable-5-1|mythos-5-1)(-|$)']
    fields:
      tool_choice: [auto, none]
      tool_choice_with_reasoning: [auto, none]
  - id: anthropic-sonnet-5-cache-minimum
    source: [anthropic-prompt-caching]
    adapters: [anthropic-messages]
    models: ['^claude-sonnet-5(?!-5)(-|$)']
    fields:
      cache_min_tokens: 1024
  - id: anthropic-mythos-preview-cache-minimum
    source: [anthropic-prompt-caching]
    adapters: [anthropic-messages]
    models: ['^claude-mythos-preview(-|$)']
    fields:
      cache_min_tokens: 2048
  - id: openai-responses
    source: [openai-migrate-to-responses, openai-function-calling, openai-reasoning, openai-prompt-caching]
    adapters: [openai-responses]
    fields:
      parallel_tools: true
      tool_choice: [auto, none, required, named]
      tool_choice_with_reasoning: [auto, none, required, named]
      strict_tools: true
      structured_output: native
      vision: true
      tool_result_media: true
      interleaved_reasoning: true
      cache: automatic
  - id: openai-reasoning-models
    source: [openai-reasoning]
    adapters: [openai-responses]
    models: ['^(gpt-(5|6)|o[0-9])']
    fields:
      reasoning: effort
      reasoning_toggle: reasoning.effort
  - id: openai-prompt-cache-minimum
    source: [openai-prompt-caching]
    adapters: [openai-responses]
    models: ['^gpt-(5\.([6-9]|[1-9][0-9])|[6-9])']
    fields:
      cache_min_tokens: 1024
  - id: gemini-interactions
    source: [gemini-interactions, gemini-function-calling, gemini-thought-signatures, gemini-caching]
    adapters: [gemini-interactions]
    fields:
      parallel_tools: true
      tool_choice: [auto, none, required, named]
      tool_choice_with_reasoning: [auto, none, required, named]
      structured_output: native
      vision: true
      interleaved_reasoning: true
      cache: automatic
  - id: gemini-3-and-4
    source: [gemini-interactions, gemini-caching]
    adapters: [gemini-interactions]
    models: ['^gemini-(3|4)']
    fields:
      reasoning: effort
      cache_min_tokens: 4096
  - id: gemini-3-temperature
    source: [gemini-3-guide]
    adapters: [gemini-interactions]
    models: ['^gemini-3']
    fields:
      recommended_sampling: {temperature: 1.0}
  - id: deepseek
    source: [deepseek-thinking-mode, deepseek-chat-completion]
    adapters: [openai-chat]
    models: ['(^|/)deepseek-(flash|v4)']
    fields:
      tool_choice: [auto, none, required, named]
      tool_choice_with_reasoning: [auto, none]
      strict_tools: true
      reasoning: effort
      reasoning_levels: [low, high, max]
      reasoning_toggle: thinking.type
      reasoning_field: reasoning_content
      replay: send_all
      replay_required_with_tools: true
      interleaved_reasoning: true
      sampling_ignored_with_reasoning: [temperature]
      cache: automatic
  - id: deepseek-v4-pro-ignores-top-p-while-reasoning
    source: [deepseek-thinking-mode]
    adapters: [openai-chat]
    models: ['(^|/)deepseek-v4-pro']
    fields:
      sampling_ignored_with_reasoning: [temperature, top_p]
  - id: vllm
    source: [vllm-reasoning-outputs]
    adapters: [openai-chat]
    servers: [vllm]
    fields:
      parallel_tools: true
      tool_choice: [auto, none, required, named]
      reasoning_field: reasoning
      cache: local_prefix
  - id: ollama-chat
    source: [ollama-thinking, ollama-tool-calling, ollama-renderers]
    adapters: [ollama-chat]
    fields:
      parallel_tools: true
      tool_id_rule: mint
      structured_output: native
      reasoning_field: thinking
      cache: local_prefix
  - id: ollama-qwen3
    source: [qwen3-thinking-card, ollama-renderers]
    adapters: [ollama-chat]
    models: ['(^|/)qwen3(\.[0-7])?([:_-]|$)']
    fields:
      reasoning: toggle
      reasoning_toggle: think
      replay: drop_earlier
      recommended_sampling: {temperature: 0.6, top_p: 0.95, top_k: 20, min_p: 0.0}
  - id: ollama-qwen3-5-and-3-6
    source: [qwen3-6-card]
    adapters: [ollama-chat]
    models: ['(^|/)qwen3\.[56]([:_-]|$)']
    fields:
      recommended_sampling: {temperature: 1.0, top_p: 0.95, top_k: 20, min_p: 0.0}
  - id: ollama-qwen3-8
    source: [ollama-renderers, ollama-thinking, qwen3-8-card]
    adapters: [ollama-chat]
    models: ['(^|/)qwen3\.8([:_-]|$)']
    fields:
      reasoning: toggle
      reasoning_toggle: think
      replay: send_all
      recommended_sampling: {temperature: 1.0, top_p: 0.95, top_k: 20, min_p: 0.0}
  - id: ollama-gpt-oss
    source: [ollama-thinking, gpt-oss-harmony]
    adapters: [ollama-chat]
    models: ['(^|/)gpt-oss']
    fields:
      reasoning: effort
      reasoning_levels: [low, medium, high]
      reasoning_toggle: null
      replay: drop_earlier
      interleaved_reasoning: true
  - id: ollama-glm
    source: [glm-thinking-mode, glm-4-7-card, ollama-renderers]
    adapters: [ollama-chat]
    models: ['(^|/)glm-']
    fields:
      reasoning: toggle
      reasoning_toggle: think
      replay: send_all
      interleaved_reasoning: true
      recommended_sampling: {temperature: 1.0, top_p: 0.95}
  - id: ollama-kimi
    source: [kimi-thinking, kimi-k2-thinking-card, ollama-thinking]
    adapters: [ollama-chat]
    models: ['(^|/)kimi-']
    fields:
      reasoning: toggle
      reasoning_toggle: think
      replay: send_all
      interleaved_reasoning: true
      recommended_sampling: {temperature: 1.0}
  - id: ollama-minimax-m2
    source: [minimax-m2-card, ollama-thinking]
    adapters: [ollama-chat]
    models: ['(^|/)minimax-m2']
    fields:
      reasoning: always_on
      replay: send_all
      interleaved_reasoning: true
      recommended_sampling: {temperature: 1.0, top_p: 0.95, top_k: 40}
  - id: ollama-gemma
    source: [ollama-thinking, ollama-tool-calling]
    adapters: [ollama-chat]
    models: ['(^|/)gemma[3-9]']
    fields:
      vision: true
  - id: ollama-gemma-3
    source: [gemma-3-parameters]
    adapters: [ollama-chat]
    models: ['(^|/)gemma3']
    fields:
      recommended_sampling: {temperature: 1.0, top_p: 0.95, top_k: 64}
  - id: ollama-gemma-4
    source: [ollama-thinking, gemma-4-card]
    adapters: [ollama-chat]
    models: ['(^|/)gemma4']
    fields:
      reasoning: toggle
      reasoning_toggle: think
      recommended_sampling: {temperature: 1.0, top_p: 0.95, top_k: 64}
  - id: native-engine
    source: [qwen3-thinking-card]
    adapters: [native]
    fields:
      prompt_tools: true
      tool_id_rule: mint
      reasoning: toggle
      reasoning_toggle: chat_template_kwargs.enable_thinking
      replay: drop_earlier
      cache: local_prefix
